const PVIEWS=[{id:"myday",l:"My day",i:"sun"},{id:"grid",l:"Grid",i:"list"},{id:"board",l:"Board",i:"board"},{id:"calendar",l:"Calendar",i:"cal"},{id:"charts",l:"Charts",i:"chart"}];
const GROUPS=[["bucket","Bucket"],["progress","Progress"],["priority","Priority"],["due","Due date"],["labels","Labels"],["assigned","Assigned to"]];
const DUEG=[["late","Late","red"],["today","Today","blue"],["tomorrow","Tomorrow","blue"],["week","This week","teal"],["next","Next week","teal"],["future","Future","gray"],["nodate","No date","gray"]];
const isOpenT=t=>t.status!=="done";
const tState=t=>{if(!t.due||!isOpenT(t))return null;const d=daysUntil(t.due);return d<0?"over":d===0?"today":null};
const bucketOf=id=>id?get("lists",id):null;
const listOf=bucketOf;
const bsort=(a,b)=>(a.order||a.created||0)-(b.order||b.created||0);
const lsort=bsort;
const buckets=()=>DB.lists.slice().sort(bsort);
function allLabels(){const over={};DB.labels.forEach(l=>over[l.id]=l);const base=DEF_LABELS.map(l=>Object.assign({},l,over[l.id]||{}));return base.concat(DB.labels.filter(l=>!DEF_LABELS.some(d=>d.id===l.id))).filter(l=>!l.hidden)}
const labelOf=id=>allLabels().find(l=>l.id===id);
const lblChip=(l,rm)=>`<span class="lbl ${l.solid?"solid":""}" data-c="${l.c}">${esc(l.name)}${rm?`<button data-lrm="${l.id}" aria-label="Remove label ${esc(l.name)}">✕</button>`:""}</span>`;
const initials=n=>String(n||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
const avatar=p=>`<span class="av" data-c="${deptOf(p.department).c}" title="${esc(p.name)}">${esc(initials(p.name))}</span>`;
function addDays(iso,n){const d=new Date(iso+"T00:00:00");d.setDate(d.getDate()+n);return isoOf(d)}
function nextDue(iso,r){const b=iso||todayISO();if(r==="daily")return addDays(b,1);if(r==="weekdays"){let d=addDays(b,1);while([0,6].includes(new Date(d+"T00:00:00").getDay()))d=addDays(d,1);return d}if(r==="weekly")return addDays(b,7);if(r==="fortnightly")return addDays(b,14);if(r==="monthly")return addMonths(b,1);if(r==="yearly")return addMonths(b,12);return b}
const fmtTime=hm=>{const[h,m]=String(hm).split(":").map(Number);const d=new Date();d.setHours(h||0,m||0);return d.toLocaleTimeString("en-AU",{hour:"numeric",minute:"2-digit"})};
const fmtShort=iso=>iso?new Date(iso+"T00:00:00").toLocaleDateString("en-AU",{day:"2-digit",month:"2-digit",year:"numeric"}):"";
function dueLabel(t){if(!t.due)return"";const d=daysUntil(t.due);let s=d===0?"Today":d===1?"Tomorrow":d===-1?"Yesterday":(d>1&&d<7)?new Date(t.due+"T00:00:00").toLocaleDateString("en-AU",{weekday:"long"}):fmtISO(t.due);if(t.time)s+=", "+fmtTime(t.time);return s}
function taskCounts(){const o=DB.tasks.filter(isOpenT),td=todayISO();return{today:o.filter(t=>t.due&&t.due<=td).length,over:o.filter(t=>tState(t)==="over").length,sched:o.filter(t=>t.due).length,all:o.length,doing:o.filter(t=>t.status==="doing").length,flag:0,done:DB.tasks.length-o.length}}
function taskSort(a,b){return(a.due||"9999").localeCompare(b.due||"9999")||(PRANK[a.prio]??2)-(PRANK[b.prio]??2)||(a.created||0)-(b.created||0)}
function normTask(x){const t=Object.assign({sent:null,routeLog:[],title:"",notes:"",start:"",due:"",time:"",prio:"",status:"todo",bucketId:"",labels:[],assignees:[],subtasks:[],repeat:"none",links:[],comments:[],docId:"",event:"",completedAt:0,created:Date.now(),updated:Date.now()},x);if(!t.bucketId&&x&&x.listId)t.bucketId=x.listId;if(!t.prio)t.prio=({3:"important",2:"medium",1:"low"})[x&&x.priority]||"medium";return t}
function normList(x){return Object.assign({name:"New bucket",color:"blue",order:(x&&x.created)||Date.now(),created:Date.now(),updated:Date.now()},x)}
function dueGroup(t){if(!t.due)return"nodate";const d=daysUntil(t.due);if(d<0)return"late";if(d===0)return"today";if(d===1)return"tomorrow";const dow=(new Date().getDay()+6)%7,toSun=6-dow;if(d<=toSun)return"week";if(d<=toSun+7)return"next";return"future"}

/* ---- filters ---- */
function filteredTasks(){
  const f=ui.plan.f,q=ui.plan.q.trim().toLowerCase();
  return DB.tasks.filter(t=>{
    if(q&&![t.title,t.notes,t.event,(t.labels||[]).map(id=>(labelOf(id)||{}).name).join(" ")].join(" ").toLowerCase().includes(q))return false;
    if(f.label&&!(t.labels||[]).includes(f.label))return false;
    if(f.prio&&t.prio!==f.prio)return false;
    if(f.person&&!(t.assignees||[]).includes(f.person))return false;
    if(f.bucket&&t.bucketId!==f.bucket)return false;
    if(f.due&&(dueGroup(t)!==f.due||!isOpenT(t)))return false;
    return true;
  });
}

/* ---- rows (My day / dashboard) ---- */
function taskRow(t,o){
  o=o||{};const done=!isOpenT(t),b=bucketOf(t.bucketId),st=tState(t),subs=t.subtasks||[],sd=subs.filter(s=>s.done).length,pr=prioOf(t.prio);
  const meta=[];
  if(t.due)meta.push(`<span class="${st==="over"?"od":st==="today"?"td":""}">${esc(dueLabel(t))}</span>`);
  if(b)meta.push(`<span>${esc(b.name)}</span>`);
  if(subs.length)meta.push(`<span>${svg("check")} ${sd}/${subs.length}</span>`);
  if(t.status==="doing")meta.push(`<span class="td">In progress</span>`);
  if(rtOpen(t))meta.push(rtBadge(t));
  const lbls=(t.labels||[]).map(labelOf).filter(Boolean);
  return`<div class="trow ${done?"done":""}" data-task="${t.id}">
    <button class="ring ${done?"on":""}" data-tcheck="${t.id}" aria-label="${done?"Mark as not done":"Mark as complete"}"></button>
    <div class="tmain"><div class="ttitle">${pr.v==="urgent"||pr.v==="important"?`<span class="pm" style="color:var(--danger)">!</span>`:""}${t.title?esc(t.title):'<span class="faint">Untitled task</span>'}</div>
    ${lbls.length?`<div class="pc-lbls" style="margin:5px 0 0">${lbls.map(l=>lblChip(l)).join("")}</div>`:""}${meta.length?`<div class="tmeta">${meta.join("")}</div>`:""}</div></div>`;
}
function tgroup(h,items,o){o=o||{};if(!items.length&&!o.keep)return"";return`<div class="tgroup"><h3 class="${o.red?"red":""}">${esc(h)}</h3><span class="n">${items.length}</span></div>${items.map(t=>taskRow(t)).join("")||`<div class="muted" style="padding:10px 6px 4px;font-size:13.5px">${esc(o.empty||"Nothing here.")}</div>`}`}
const pEmpty=(a,b,x)=>`<div class="empty"><p class="big">${esc(a)}</p><p>${esc(b)}</p>${x||""}</div>`;

/* ---- board ---- */
function boardColumns(T){
  const g=ui.plan.group;
  if(g==="progress")return TSTAT.map(s=>({key:"s:"+s.n,name:s.l,c:s.c,tasks:T.filter(t=>t.status===s.n),drop:{status:s.n},add:{status:s.n},flat:true}));
  if(g==="priority")return PRIOS.map(p=>({key:"p:"+p.v,name:p.l,c:p.c,tasks:T.filter(t=>t.prio===p.v),drop:{prio:p.v},add:{prio:p.v}}));
  if(g==="due"){const map={today:todayISO(),tomorrow:addDays(todayISO(),1)};return DUEG.map(([k,l,c])=>({key:"d:"+k,name:l,c,tasks:T.filter(t=>isOpenT(t)?dueGroup(t)===k:(k==="nodate"&&false)),add:{due:map[k]||""},flat:true})).filter(c=>c.tasks.length||["today","tomorrow","nodate"].includes(c.key.slice(2)))}
  if(g==="labels"){const ls=allLabels();const cols=ls.map(l=>({key:"l:"+l.id,name:l.name,lbl:l,tasks:T.filter(t=>(t.labels||[]).includes(l.id)),add:{labels:[l.id]}})).filter(c=>c.tasks.length);cols.push({key:"l:",name:"No label",tasks:T.filter(t=>!(t.labels||[]).length),add:{}});return cols}
  if(g==="assigned"){const ppl=DB.people.filter(p=>T.some(t=>(t.assignees||[]).includes(p.id)));return ppl.map(p=>({key:"a:"+p.id,name:p.name,person:p,tasks:T.filter(t=>(t.assignees||[]).includes(p.id)),add:{assignees:[p.id]}})).concat([{key:"a:",name:"Unassigned",tasks:T.filter(t=>!(t.assignees||[]).length),add:{}}])}
  const cols=buckets().map(b=>({key:"b:"+b.id,name:b.name,bucket:b,tasks:T.filter(t=>t.bucketId===b.id),drop:{bucketId:b.id},add:{bucketId:b.id}}));
  const orphan=T.filter(t=>!t.bucketId||!bucketOf(t.bucketId));
  if(orphan.length)cols.unshift({key:"b:",name:"No bucket",tasks:orphan,drop:{bucketId:""},add:{bucketId:""}});
  return cols;
}
function pcard(t){
  const done=!isOpenT(t),lbls=(t.labels||[]).map(labelOf).filter(Boolean),subs=t.subtasks||[],sd=subs.filter(s=>s.done).length,pr=t.prio;
  const ppl=(t.assignees||[]).map(id=>get("people",id)).filter(Boolean);
  const f=[];
  if(pr==="urgent")f.push(`<span class="it" style="color:var(--danger)" title="Urgent">${svg("bell")}</span>`);
  else if(pr==="important")f.push(`<span class="it pimp" title="Important">!</span>`);
  else if(pr==="low")f.push(`<span class="it" style="color:var(--accent)" title="Low">${svg("down")}</span>`);
  if(t.status==="doing")f.push(`<span class="it" title="In progress"><span class="half"></span></span>`);
  if(rtOpen(t))f.push(rtBadge(t));
  if(t.due)f.push(`<span class="it dchip ${tState(t)==="over"?"late":done?"ok":""}">${svg("cal")}${esc(fmtShort(t.due))}</span>`);
  if(subs.length)f.push(`<span class="it" title="Checklist">${svg("checklist")}${sd} / ${subs.length}</span>`);
  if(t.notes)f.push(`<span class="it" title="Has notes">${svg("note")}</span>`);
  if((t.comments||[]).length)f.push(`<span class="it" title="Comments">${svg("chat")}${t.comments.length}</span>`);
  if((t.links||[]).length||t.docId)f.push(`<span class="it" title="Attachments">${svg("clip")}${(t.links||[]).length+(t.docId?1:0)}</span>`);
  return`<div class="pcard ${done?"done":""}" draggable="true" data-task="${t.id}" data-tdrag="${t.id}" tabindex="0">
    ${lbls.length?`<div class="pc-lbls">${lbls.map(l=>lblChip(l)).join("")}</div>`:""}
    <div class="pc-t"><button class="pring ${done?"on":""}" data-tcheck="${t.id}" aria-label="${done?"Mark as not complete":"Mark as complete"}">${svg("check")}</button><span>${t.title?esc(t.title):'<span class="faint">Untitled task</span>'}</span></div>
    ${f.length||ppl.length?`<div class="pc-f">${f.join("")}<span class="spacer"></span><span class="avs">${ppl.slice(0,3).map(avatar).join("")}</span></div>`:""}</div>`;
}

const newBucketCol=()=>`<section class="pcol newbucket"><input class="fi" id="newbucket" placeholder="Add new bucket" aria-label="New bucket name"></section>`;

/* ---- grid ---- */
function renderGridP(T){
  const s=ui.plan.sort,list=T.slice();
  const key={title:t=>(t.title||"").toLowerCase(),due:t=>t.due||"9999",start:t=>t.start||"9999",bucket:t=>(bucketOf(t.bucketId)||{name:"~"}).name,status:t=>TSTAT.findIndex(x=>x.n===t.status),prio:t=>PRANK[t.prio]??2,assigned:t=>((t.assignees||[]).map(id=>(get("people",id)||{}).name).join(",")||"~")};
  list.sort((a,b)=>{const x=key[s.k](a),y=key[s.k](b);return(x<y?-1:x>y?1:0)*s.d||taskSort(a,b)});

  return`<div class="tablewrap"><table><thead><tr><th style="width:44px"></th>${H.map(([k,l])=>`<th>${k?`<button data-psort="${k}">${l}${s.k===k?`<span class="arrow">${s.d>0?"▲":"▼"}</span>`:""}</button>`:`<button>${l}</button>`}</th>`).join("")}</tr></thead><tbody>
  ${list.map(t=>{const st=statOf(t.status),pr=prioOf(t.prio),b=bucketOf(t.bucketId),ppl=(t.assignees||[]).map(id=>get("people",id)).filter(Boolean);return`<tr data-task="${t.id}" class="${isOpenT(t)?"":"rev"}">
    <td><button class="pring ${isOpenT(t)?"":"on"}" data-tcheck="${t.id}" aria-label="Toggle complete">${svg("check")}</button></td>
    <td class="name">${t.title?esc(t.title):'<span class="faint">Untitled task</span>'}</td>
    <td>${ppl.length?`<span class="avs" style="padding-left:6px">${ppl.map(avatar).join("")}</span>`:dash}</td>
    <td class="muted">${t.start?esc(fmtShort(t.start)):dash}</td>
    <td style="${tState(t)==="over"?"color:var(--danger);font-weight:600":""}">${t.due?esc(fmtShort(t.due)):dash}</td>
    <td class="muted">${b?esc(b.name):dash}</td>
    <td>${tag(st.l,st.c,true)}</td><td>${tag(pr.l,pr.c)}</td>
    <td>${(t.labels||[]).map(labelOf).filter(Boolean).map(l=>lblChip(l)).join(" ")||dash}</td></tr>`}).join("")}</tbody></table></div>
  <button class="addrow" data-newtask>＋ Add task</button><div class="count">${T.length} tasks</div>`;

/* ---- calendar ---- */
function renderCalendar(T){
  const[y,m]=ui.plan.month.split("-").map(Number),first=new Date(y,m-1,1),start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
  const today=todayISO(),byDay={};T.forEach(t=>{if(t.due)(byDay[t.due]=byDay[t.due]||[]).push(t)});
  let cells="";
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);if(i===35&&d.getMonth()!==m-1)break;
    const iso=isoOf(d),items=(byDay[iso]||[]).sort((a,b)=>isOpenT(b)-isOpenT(a)||taskSort(a,b));
    cells+=`<div class="day ${d.getMonth()!==m-1?"other":""} ${iso===today?"today":""}" data-calday="${iso}"><span class="dn">${d.getDate()}</span>${items.slice(0,3).map(t=>{const l=(t.labels||[]).map(labelOf).find(Boolean);return`<button class="ev ${isOpenT(t)?"":"done"}" data-c="${l?l.c:(tState(t)==="over"?"red":"blue")}" data-task="${t.id}">${esc(t.title||"Untitled task")}</button>`}).join("")}${items.length>3?`<span class="more">${items.length-3} more</span>`:""}</div>`}
  return`<div class="panel"><div class="calhead"><h3>${esc(first.toLocaleDateString("en-AU",{month:"long"}))} <span>${y}</span></h3><span class="spacer"></span><button class="ctl" data-calnav="-1" aria-label="Previous month">${svg("chevL")}</button><button class="ctl" data-calnav="0">Today</button><button class="ctl" data-calnav="1" aria-label="Next month">${svg("chevR")}</button></div>
  <div class="cal">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<div class="dow">${d}</div>`).join("")}${cells}</div></div>`;
}

  const pr=PRIOS.map(p=>({p,n:open.filter(t=>t.prio===p.v).length})),maxP=Math.max(1,...pr.map(x=>x.n));
  const ppl=DB.people.map(p=>({p,n:open.filter(t=>(t.assignees||[]).includes(p.id)).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n),un=open.filter(t=>!(t.assignees||[]).length).length,maxM=Math.max(1,un,...ppl.map(x=>x.n));
  return`<div class="dgrid">

      <ul class="dlist">${TSTAT.map(s=>`<li><span class="cdot" style="background:${COL[s.n]}"></span>${s.l}<span class="r">${sc[s.n]}</span></li>`).join("")}<li><span class="cdot" style="background:var(--s-red)"></span>Late<span class="r" style="color:var(--danger)">${late}</span></li></ul></div></section>

  const later=ok.filter(p=>p.review>lim);
  const html=polRSec("Overdue",over,{red:true,note:"Past their review date. Send each one for review so you can track who has it and when it is due back, then record the review to roll the date forward."})
    +polRSec("Due in the next 30 days",d30)+polRSec("Due in 31 to 90 days",d90)
    +polRSec("Approved, but no review date",nod,{mode:"nodate",note:"Pick a date so these come up for review."})
    +polRSec("Flagged as needing an update",upd,{mode:"update"})
    +Object.keys(months).sort().map(k=>polRSec(new Date(k+"-01T00:00:00").toLocaleDateString("en-AU",{month:"long",year:"numeric"}),months[k])).join("")
    +polRSec("Later",later);
  return html?`<div class="panel">${html}</div>`:`<div class="panel">${polNoMatch()}</div>`;
}

/* ---- pipeline ---- */
function polPipeline(){
  const list=polFiltered({only:["area","risk","owner","type"],noPreset:true});
  return`<div class="board pipe">${POL_STAGES.filter(s=>s.n!=="Retired").map(s=>{const items=list.filter(p=>p.stage===s.n).sort(polNumCmp);
    return`<section class="col" data-pdrop="${esc(s.n)}"><div class="col-head">${tag(s.n,s.c,true)}<span class="n">${items.length}</span></div><p class="colhint">${esc(s.h)}</p>
    ${items.map(p=>{const rk=polRisk(p.risk);return`<button class="card" draggable="true" data-pol="${p.id}" data-poldrag="${p.id}"><div class="card-t">${esc(p.title)||'<span class="faint">Untitled</span>'}</div>
      <div class="card-m"><span class="cdot" data-c="${polArea(p.area).c}" title="${esc(p.area)}"></span><span class="ref">${esc(p.num)||"—"}</span>${rk&&rk.n!=="Nil"?tag(rk.l,rk.c):""}${p.approval?`<span>${esc(p.approval)}</span>`:""}${polRState(p)==="over"?'<span style="color:var(--danger)">Review overdue</span>':""}</div></button>`}).join("")||'<p class="colhint" style="margin-top:8px">Nothing here.</p>'}
    </section>`}).join("")}</div>`;

/* ---- insights ---- */
function polInsights(){
  const A=DB.policies.filter(polActive);if(!A.length)return polNoMatch();
  const stages=POL_STAGES.filter(s=>s.n!=="Retired");
  const areas=POL_AREAS.map(a=>a.n).concat([...new Set(A.map(p=>p.area).filter(a=>!POL_AREAS.some(x=>x.n===a)))]);
  const maxA=Math.max(1,...areas.map(a=>A.filter(p=>p.area===a).length));
  const areaRows=areas.map(a=>{const g=A.filter(p=>p.area===a);if(!g.length)return"";const ap=g.filter(p=>p.stage==="Approved").length;
    return`<div class="arow rowlink" data-pgarea="${esc(a)}"><span><span class="cdot" data-c="${polArea(a).c}" style="display:inline-block;margin-right:7px"></span>${esc(a||"No area")}</span><span class="stk" style="width:${g.length/maxA*100}%">${stages.map(s=>{const n=g.filter(p=>p.stage===s.n).length;return n?`<span data-c="${s.c}" style="width:${n/g.length*100}%" title="${esc(s.n)}: ${n}"></span>`:""}).join("")}</span><span class="r"><b>${Math.round(ap/g.length*100)}%</b> <span class="faint">approved</span></span></div>`}).join("");
  // reviews by month
  const ap=A.filter(p=>["Approved","Needs update"].includes(p.stage)&&p.review);
  const ov=ap.filter(p=>daysUntil(p.review)<0).length;
  const mk=[...Array(12)].map((_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+i);return isoOf(d).slice(0,7)});
  const mc=mk.map(k=>ap.filter(p=>p.review.slice(0,7)===k&&daysUntil(p.review)>=0).length);
  const mx=Math.max(1,ov,...mc);
  const bars=`<div class="mbars" role="img" aria-label="Reviews due by month">${[["over","Overdue",ov]].concat(mk.map((k,i)=>[k,new Date(k+"-01T00:00:00").toLocaleDateString("en-AU",{month:"short"})+(k.endsWith("-01")?" "+k.slice(2,4):""),mc[i]])).map(([k,l,n])=>`<div class="mbar ${k==="over"?"over":""}" title="${esc(l)}: ${n}"><b>${n||""}</b><i style="height:${n/mx*100}%"></i><small>${esc(l)}</small></div>`).join("")}</div>`;
  // risk x stage
  const risks=POL_RISKS.map(r=>({n:r.n,l:r.l})).concat([{n:"",l:"Not set"}]);
  const cell=(r,s)=>A.filter(p=>(p.risk||"")===r.n&&p.stage===s.n).length;
  const mxm=Math.max(1,...risks.flatMap(r=>stages.map(s=>cell(r,s))));
  const matrix=`<div class="tablewrap"><table class="matrix"><thead><tr><th class="rh">Risk \\ Stage</th>${stages.map(s=>`<th>${esc(s.n)}</th>`).join("")}</tr></thead><tbody>${risks.filter(r=>stages.some(s=>cell(r,s))).map(r=>`<tr><td class="rh">${r.n?tag(r.l,(polRisk(r.n)||{c:"gray"}).c):'<span class="muted">Not set</span>'}</td>${stages.map(s=>{const n=cell(r,s);const hot=["High","Critical"].includes(r.n)&&s.n!=="Approved";return`<td>${n?`<button data-pmx="${esc(r.n)}|${esc(s.n)}" style="background:color-mix(in srgb,var(${hot?"--s-red":"--s-blue"}) ${Math.round(12+n/mxm*55)}%,transparent)" title="${n} ${esc(r.l)} risk · ${esc(s.n)}">${n}</button>`:'<span class="faint">·</span>'}</td>`}).join("")}</tr>`).join("")}</tbody></table></div><p class="muted" style="font-size:12.5px;margin:10px 0 0">Red cells are high-risk documents that aren't approved yet. Select a cell to see the documents.</p>`;
  // owner workload
  const owners=[...new Set(A.map(p=>p.owner||"Not set"))].map(o=>{const g=A.filter(p=>(p.owner||"Not set")===o);return{o,n:g.length,ap:g.filter(p=>p.stage==="Approved").length,pipe:g.filter(p=>!["Approved","On hold"].includes(p.stage)).length,due:g.filter(p=>["over","d30","d90"].includes(polRState(p))).length}}).sort((a,b)=>b.n-a.n);
  const own=`<table class="mini"><colgroup><col><col style="width:70px"><col style="width:84px"><col style="width:96px"><col style="width:84px"></colgroup><thead><tr><th><button>Owner</button></th><th><button>Total</button></th><th><button>Approved</button></th><th><button>In progress</button></th><th><button>Reviews due</button></th></tr></thead><tbody>${owners.map(x=>`<tr data-powner="${esc(x.o)}"><td class="name" title="${esc(x.o)}">${esc(x.o)}</td><td>${x.n}</td><td>${x.ap}</td><td>${x.pipe}</td><td style="${x.due?"color:var(--danger);font-weight:600":""}">${x.due||dash}</td></tr>`).join("")}</tbody></table>`;
  return`<div class="dgrid">
    <section class="panel s7"><div class="panel-h"><h2>Progress by policy area</h2></div>${areaRows}<div class="legend" style="margin-top:12px">${stages.map(s=>`<span><i style="background:var(--s-${s.c})"></i>${esc(s.n)}</span>`).join("")}</div></section>
    <section class="panel s5"><div class="panel-h"><h2>Reviews due by month</h2><span class="muted" style="margin-left:auto;font-size:12.5px">Next 12 months</span></div>${bars}</section>
    <section class="panel s7"><div class="panel-h"><h2>Risk and stage</h2></div>${matrix}</section>
    <section class="panel s5"><div class="panel-h"><h2>By document owner</h2></div>${own}</section></div>`;
}

/* ---- data checks ---- */

  const SEV={error:{c:"red",l:"!"},warn:{c:"orange",l:"!"},info:{c:"blue",l:"i"}};

    return`<section class="cksec"><button class="ckh" data-pck="${c.id}" aria-expanded="${open}"><span class="sev" data-c="${SEV[c.sev].c}">${SEV[c.sev].l}</span><span><h3>${esc(c.title)}</h3><p>${esc(c.desc)}</p></span><span class="n">${c.items.length}</span>${svg(open?"chevD":"chevR")}</button>

/* ---- detail sheet ---- */
function openPol(id,focus,mode){ui.peek={kind:"pol",id};ui.pol.act=mode?{force:mode}:{};ui.section="pol";showPeek(focus);if(mode==="review"||mode==="approve")setTimeout(()=>{const x=$("polActBox");if(x)x.scrollIntoView({behavior:"smooth",block:"start"})},260)}
function polLevelOpts(sel,blank){return(blank?`<option value="">${esc(blank)}</option>`:"")+POL_LEVELS.concat(sel&&!POL_LEVELS.includes(sel)?[sel]:[]).map(l=>`<option ${l===sel?"selected":""}>${esc(l)}</option>`).join("")}
function polCycleOpts(sel){return POL_CYCLES.concat(POL_CYCLES.some(c=>c[0]===+sel)?[]:[[+sel,`Every ${sel} months`]]).map(([m,l])=>`<option value="${m}" ${+sel===m?"selected":""}>${l}</option>`).join("")}
function polActBox(p){
  const a=ui.pol.act,st=polStage(p.stage),date=a.date||todayISO();

        ${oc!=="retire"?`<div><label class="fl" for="pa-cycle">Next review in</label><select class="fi" id="pa-cycle" data-pa="cycle">${polCycleOpts(cyc)}</select></div>`:""}
        <div class="full"><label class="fl" for="pa-sum">${oc==="retire"?"Reason":"Summary"}</label><input class="fi" id="pa-sum" data-pa="summary" value="${esc(a.summary||"")}" placeholder="${oc==="same"?"Optional, e.g. Checked against current legislation, no changes":oc==="retire"?"e.g. Replaced by RIS-RM:002":"What changed and why"}"></div>

  }

    return`<div class="sec" id="polActBox">Record approval</div><div class="actbox">
      <div class="fgrid">
        <div><label class="fl" for="pa-level">Approved by</label><select class="fi" id="pa-level" data-pa="level">${polLevelOpts(a.level!=null?a.level:p.approval,"Choose")}</select></div>
        <div><label class="fl" for="pa-date">Approval date</label><input class="fi" id="pa-date" type="date" data-pa="date" value="${esc(date)}"></div>
        <div><label class="fl" for="pa-ver">Version</label><input class="fi" id="pa-ver" data-pa="version" value="${esc(v)}"></div>
        <div><label class="fl" for="pa-cycle">Next review in</label><select class="fi" id="pa-cycle" data-pa="cycle">${polCycleOpts(cyc)}</select></div>
        <div class="full"><label class="fl" for="pa-sum">Note</label><input class="fi" id="pa-sum" data-pa="summary" value="${esc(a.summary||"")}" placeholder="Optional, e.g. Board meeting 12 May, item 4.2"></div>
      </div>
      ${a.err?`<div class="err">${esc(a.err)}</div>`:""}
      <div class="actfoot"><button class="btn btn-primary" id="pol-appr-go">Record approval</button>${a.force==="approve"?`<button class="btn btn-quiet" id="pol-appr-cancel">Cancel</button>`:""}<span class="faint" style="font-size:12.5px">Becomes Approved as ${esc(v||"V1.0")} · next review ${next?esc(fmtISO(next)):"not scheduled"}</span></div></div>`;

}

document.addEventListener("dragstart",e=>{const c=e.target.closest&&e.target.closest("[data-poldrag]");if(!c)return;polDrag=c.dataset.poldrag;c.classList.add("dragging");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",polDrag)}catch(_){}});
document.addEventListener("dragover",e=>{if(!polDrag)return;const c=e.target.closest&&e.target.closest("[data-pdrop]");if(!c)return;e.preventDefault();document.querySelectorAll(".col.over").forEach(x=>x!==c&&x.classList.remove("over"));c.classList.add("over")});
document.addEventListener("drop",e=>{if(!polDrag)return;const c=e.target.closest&&e.target.closest("[data-pdrop]");const id=polDrag;polDrag=null;if(!c)return;e.preventDefault();document.querySelectorAll(".col.over").forEach(x=>x.classList.remove("over"));polSetStage(id,c.dataset.pdrop)});
document.addEventListener("dragend",()=>{polDrag=null});


/* ================= review & approval routing ================= */
const RT_KIND={review:{l:"Sent for review",short:"review",c:"purple"},approval:{l:"Sent for approval",short:"approval",c:"orange"}};
const RT_METHODS=["Email","Microsoft Teams","In person","Board papers","Hard copy"];
const RT_OUT={review:[["nochange","Reviewed – no changes needed","green"],["minor","Reviewed – minor changes made","blue"],["changes","Changes requested","orange"]],
  approval:[["approved","Approved","green"],["changes","Not approved – changes requested","orange"]]};
const RT_OUTL={nochange:"No changes needed",minor:"Minor changes made",changes:"Changes requested",approved:"Approved",withdrawn:"Withdrawn",closed:"Closed without a response"};
const rtOpen=t=>t&&(t.status==="review"||t.status==="approval")&&t.sent?t.sent:null;
const rtLate=s=>!!(s&&s.due&&daysUntil(s.due)<0);
const rtSoon=s=>!!(s&&s.due&&daysUntil(s.due)>=0&&daysUntil(s.due)<=2);
const rtDaysOut=s=>s&&s.on?Math.max(0,-daysUntil(s.on)):0;
function addWorkdays(iso,n){const d=new Date(iso+"T00:00:00");let k=0;while(k<n){d.setDate(d.getDate()+1);const w=d.getDay();if(w&&w!==6)k++}return isoOf(d)}
function rtDueText(s){if(!s||!s.due)return"No response date";const d=daysUntil(s.due);if(d<0)return`${-d} day${d===-1?"":"s"} overdue`;if(d===0)return"Due today";if(d===1)return"Due tomorrow";return`Due in ${d} days`}
const rtWho=s=>`${s.to||"Not recorded"}${s.role?` (${s.role})`:""}`;
const rtFirst=n=>String(n||"").trim().split(/\s+/)[0]||"there";
function rtPolicyOf(t){return t&&t.policyId?get("policies",t.policyId):null}
function rtAllRounds(){const out=[];DB.tasks.forEach(t=>{(t.routeLog||[]).forEach(r=>out.push(Object.assign({task:t},r)));const s=rtOpen(t);if(s)out.push(Object.assign({task:t,open:true},s))});return out}
function rtKnownPeople(){const m={};
  DB.people.forEach(p=>{if(p.name)m[p.name]=m[p.name]||{name:p.name,email:p.email||"",role:""}});
  DB.tasks.forEach(t=>[].concat(t.routeLog||[],t.sent?[t.sent]:[]).forEach(r=>{if(!r.to)return;const x=m[r.to]=m[r.to]||{name:r.to,email:"",role:""};if(r.email)x.email=r.email;if(r.role)x.role=r.role}));
  return Object.values(m).sort((a,b)=>a.name.localeCompare(b.name))}
function rtSubject(t,s,remind){const p=rtPolicyOf(t),what=p?`${p.title}${p.num?` (${p.num})`:""}`:(t.title||"Document");
  const k=s.kind==="approval"?"approval":"review";
  return remind?`Reminder: ${k} of ${what}${s.due?(daysUntil(s.due)<0?` – response was due ${fmtISO(s.due)}`:` – response due ${fmtISO(s.due)}`):""}`:`For ${k}: ${what}${s.due?` – response requested by ${fmtISO(s.due)}`:""}`}
function rtBody(t,s,remind){const p=rtPolicyOf(t),what=p?`${p.title}${p.num?` (${p.num}${p.version?`, ${p.version}`:""})`:""}`:(t.title||"the attached document");
  const link=p&&/^https?:\/\//i.test(p.link||"")?`\n\nDocument: ${p.link}`:"";const note=s.note?`\n\n${s.note}`:"";const sig=`\n\nKind regards,\n${me()}`;
  if(remind)return`Hi ${rtFirst(s.to)},\n\nA quick reminder about the ${what}, which I sent for your ${s.kind==="approval"?"approval":"review"} on ${fmtISO(s.on)}.${s.due?` A response was requested by ${fmtISO(s.due)}.`:""}\n\nCould you let me know where it's up to, or when you expect to get back to me?${link}${sig}`;
  if(s.kind==="approval")return`Hi ${rtFirst(s.to)},\n\nThe ${what} is ready for approval${s.role?` at ${s.role} level`:""}.\n\nCould you please confirm${s.due?` by ${fmtISO(s.due)}`:""} that you approve the document, or let me know of any changes needed before it can be approved.${link}${note}${sig}`;
  const over=p&&p.review&&daysUntil(p.review)<0?` It was due for review on ${fmtISO(p.review)}.`:"";
  return`Hi ${rtFirst(s.to)},\n\nPlease review the ${what} as part of its scheduled review.${over}\n\nCould you please confirm${s.due?` by ${fmtISO(s.due)}`:""} whether:\n• the document is still accurate and current, with no changes needed; or\n• changes are needed (tracked changes or comments are fine).${link}${note}${sig}`}
const rtMailto=(t,s,remind)=>`mailto:${encodeURIComponent(s.email||"").replace(/%40/g,"@")}?subject=${encodeURIComponent(rtSubject(t,s,remind))}&body=${encodeURIComponent(rtBody(t,s,remind))}`;
function rtCopy(text){const done=()=>toast("Email text copied");try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,()=>fb());return}}catch(e){}fb();
  function fb(){const a=document.createElement("textarea");a.value=text;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy");done()}catch(e){toast("Couldn't copy. Select the text and copy it yourself.")}a.remove()}}
function rtDefaults(t,kind){
  const p=rtPolicyOf(t),prev=[].concat(t.sent?[t.sent]:[],(t.routeLog||[]).slice().reverse()).find(r=>r.kind===kind&&r.to);
  const role=prev?prev.role:p?(kind==="approval"?p.approval:(p.owner||p.approval)):"";
  const who=prev?prev.to:(kind==="review"&&p&&p.person?p.person:"");
  const known=rtKnownPeople().find(x=>x.name===who);
  return{kind,to:who,role:role||"",email:prev?prev.email||"":known?known.email:"",on:todayISO(),due:addWorkdays(todayISO(),10),method:"Email",note:"",edit:false,err:""};
}
function rtStartSend(taskId,kind){const t=get("tasks",taskId);if(!t)return;ui.tm.tab="details";ui.tm.send=rtDefaults(t,kind);ui.tm.resp=null;renderTM();setTimeout(()=>{const x=$("rt-to");if(x&&!x.value)x.focus()},80)}

      <div><label class="fl" for="rt-method">Sent by</label><select class="fi" id="rt-method" data-rt="method">${RT_METHODS.map(m=>`<option ${m===f.method?"selected":""}>${m}</option>`).join("")}</select></div>
      <div><label class="fl" for="rt-on">Date sent</label><input class="fi" type="date" id="rt-on" data-rt="on" value="${esc(f.on)}"></div>
      <div><label class="fl" for="rt-due">Response due</label><input class="fi" type="date" id="rt-due" data-rt="due" value="${esc(f.due)}">
        <div class="rtquick">${[[5,"1 week"],[10,"2 weeks"],[20,"4 weeks"]].map(([n,l])=>`<button class="link" data-rtdue="${n}">${l}</button>`).join("")}<span class="faint">working days from the date sent</span></div></div>
      <div class="full"><label class="fl" for="rt-note">Message or instructions <span class="faint">(optional, included in the email)</span></label><textarea class="fi rtnote" id="rt-note" data-rt="note" rows="2" placeholder="e.g. Please focus on section 4, which changed after the accreditation report.">${esc(f.note)}</textarea></div>

    <div class="actfoot"><button class="btn btn-primary" id="rt-go">${svg("send")}${f.edit?"Save changes":`Mark as ${k.l.toLowerCase()}`}</button><button class="btn btn-quiet" id="rt-cancel">Cancel</button></div>
  </div>`;
}
function rtCard(t){
  if(ui.tm.send)return rtForm(t);
  const s=rtOpen(t);if(!s)return"";const k=RT_KIND[s.kind],late=rtLate(s),ch=s.chases||[],r=ui.tm.resp;
  const resp=r?`<div class="rtresp"><div class="fl" style="margin-bottom:6px">Response from ${esc(s.to||"the reviewer")}</div>
      <div class="seg">${RT_OUT[s.kind].map(([v,l])=>`<button class="${r.out===v?"on":""}" data-rtout="${v}">${esc(l)}</button>`).join("")}</div>
      <div class="tm-grid"><div><label class="fl" for="rt-back">Date received</label><input class="fi" type="date" id="rt-back" data-rtr="back" value="${esc(r.back)}"></div>
      <div style="display:flex;align-items:flex-end"><label class="rtchk"><input type="checkbox" id="rt-done" data-rtr="done" ${r.done?"checked":""}> Mark this task complete</label></div>
      <div class="full"><label class="fl" for="rt-rnote">Comments received <span class="faint">(optional)</span></label><textarea class="fi rtnote" id="rt-rnote" data-rtr="note" rows="2" placeholder="Summary of their feedback">${esc(r.note)}</textarea></div></div>
      ${r.err?`<div class="err">${esc(r.err)}</div>`:""}
      ${rtPolicyOf(t)&&(r.out==="approved"||r.out==="nochange"||r.out==="minor")?`<p class="muted" style="font-size:12.5px;margin:10px 0 0">Next, the policy register opens so you can record the ${r.out==="approved"?"approval (version, date and next review)":"review and roll the review date forward"}.</p>`:""}
      <div class="actfoot"><button class="btn btn-primary" id="rt-rgo" ${r.out?"":"disabled"}>Save response</button><button class="btn btn-quiet" id="rt-rcancel">Cancel</button></div></div>`:"";
  return`<div class="rtbox ${late?"late":""}" data-c="${k.c}">
    <div class="rth"><span class="tag" data-c="${k.c}">${svg("send")}${k.l}</span>${late?`<span class="tag" data-c="red">Response overdue</span>`:rtSoon(s)?`<span class="tag" data-c="orange">Response due soon</span>`:""}</div>
    <div class="rtgrid">
      <div><label>With</label><b>${esc(s.to||"Not recorded")}</b><small>${esc(s.role||"")}${s.email?`${s.role?" · ":""}${esc(s.email)}`:""}</small></div>
      <div><label>Sent</label><b>${esc(fmtISO(s.on))}</b><small>${esc(s.method||"")} · ${rtDaysOut(s)} day${rtDaysOut(s)===1?"":"s"} ago</small></div>
      <div class="${late?"rtl":""}"><label>Response due</label><b>${esc(fmtISO(s.due)||"Not set")}</b><small>${esc(rtDueText(s))}</small></div>
      <div><label>Reminders</label><b>${ch.length||"None"}</b><small>${ch.length?`Last ${esc(fmtISO(ch[ch.length-1]))}`:"sent yet"}</small></div>
    </div>
    ${s.note?`<p class="rtmsg">“${esc(s.note)}”</p>`:""}
    ${r?resp:`<div class="actfoot">
      <button class="btn btn-primary" id="rt-resp">${svg("check")}Record response</button>
      <a class="btn btn-quiet" href="${esc(rtMailto(t,s,true))}" target="_blank" rel="noopener" data-rtchase="1">${svg("bell")}Send reminder</a>
      <a class="btn btn-quiet" href="${esc(rtMailto(t,s,false))}" target="_blank" rel="noopener">${svg("send")}Email draft</a>
      <span class="spacer"></span>
      <button class="ctl" id="rt-copy">Copy email</button><button class="ctl" id="rt-edit">Edit</button><button class="ctl" id="rt-withdraw">Withdraw</button></div>`}
  </div>`;
}
function rtHistory(t){
  const L=(t.routeLog||[]).slice().reverse(),s=rtOpen(t);if(!L.length&&!s)return"";
  const row=(r,open)=>{const k=RT_KIND[r.kind]||RT_KIND.review,days=r.back&&r.on?Math.max(0,Math.round((new Date(r.back)-new Date(r.on))/864e5)):null;
    return`<li><span class="vpill ${open?"minor":r.outcome==="approved"||r.outcome==="nochange"?"major":"event"}">${open?"Open":esc(({nochange:"No change",minor:"Minor",changes:"Changes",approved:"Approved",withdrawn:"Withdrawn",closed:"Closed"})[r.outcome]||"·")}</span><div><div class="tl-head"><strong>${esc(k.l)} to ${esc(rtWho(r))}</strong><span>${esc(fmtISO(r.on))}${r.back?` → ${esc(fmtISO(r.back))}`:""}${days!=null?` · ${days} day${days===1?"":"s"}`:""}</span></div>
      <p class="tl-sum">${open?`Response due ${esc(fmtISO(r.due))} · ${esc(rtDueText(r))}`:esc(RT_OUTL[r.outcome]||r.outcome||"")}${r.outNote?` — ${esc(r.outNote)}`:""}${(r.chases||[]).length?` · ${(r.chases||[]).length} reminder${(r.chases||[]).length===1?"":"s"}`:""}</p></div></li>`};
  return`<h4 class="tm-h">Review & approval trail <span class="muted" style="font-weight:400;font-size:13px">${L.length+(s?1:0)}</span></h4><ol class="timeline">${s?row(s,true):""}${L.map(r=>row(r,false)).join("")}</ol>`;
}
function rtComment(t,text){return(t.comments||[]).concat([{id:newId(),by:me(),text,at:Date.now(),sys:true}])}
function rtPolHist(t,kind,summary){const p=rtPolicyOf(t);if(!p)return;setF("policies",p.id,{history:polHist(p,{kind,v:p.version,summary})},0)}

function rtSubmitSend(){
  const t=get("tasks",ui.tm.id),f=ui.tm.send;if(!t||!f)return;
  f.to=String(f.to||"").trim();f.email=String(f.email||"").trim();
  if(!f.to){f.err="Add who it's being sent to.";return renderTM()}
  if(!f.on){f.err="Add the date it was sent.";return renderTM()}
  if(f.due&&f.due<f.on){f.err="The response date is before the date sent.";return renderTM()}
  if(f.email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email)){f.err="That email address doesn't look right.";return renderTM()}
  const k=RT_KIND[f.kind];
  if(f.edit){const s=Object.assign({},t.sent,{to:f.to,role:f.role,email:f.email,on:f.on,due:f.due,method:f.method,note:f.note});
    setF("tasks",t.id,{sent:s,comments:rtComment(t,`Updated: ${k.l.toLowerCase()} to ${rtWho(s)}, response due ${fmtISO(s.due)||"not set"}.`)},0);
    ui.tm.send=null;renderAll();toast("Details updated");return}
  const prev=rtOpen(t),log=(t.routeLog||[]).slice();if(prev)log.push(Object.assign({},prev,{back:todayISO(),outcome:"withdrawn",outNote:"Replaced by a new request"}));
  const s={kind:f.kind,to:f.to,role:f.role,email:f.email,on:f.on,due:f.due,method:f.method,note:f.note,chases:[],by:me(),at:Date.now()};
  const patch={status:f.kind,completedAt:0,sent:s,routeLog:log,comments:rtComment(t,`${k.l} to ${rtWho(s)} by ${s.method.toLowerCase()} on ${fmtISO(s.on)}.${s.due?` Response due ${fmtISO(s.due)}.`:""}${s.note?`\n${s.note}`:""}`)};
  if(s.due&&(!t.due||t.due<s.due))patch.due=s.due;
  setF("tasks",t.id,patch,0);
  rtPolHist(t,"Sent",`${k.l} to ${rtWho(s)} by ${s.method.toLowerCase()}${s.due?`, response due ${fmtISO(s.due)}`:""}`);
  ui.tm.send=null;renderAll();toast(`${k.l} to ${s.to}${s.method==="Email"?". Use Email draft to send it.":""}`);
}
function rtSubmitResp(){
  const t=get("tasks",ui.tm.id),s=rtOpen(t),r=ui.tm.resp;if(!t||!s||!r)return;
  if(!r.out){r.err="Choose the outcome.";return renderTM()}
  if(!r.back){r.err="Add the date you got the response.";return renderTM()}
  const rec=Object.assign({},s,{back:r.back,outcome:r.out,outNote:String(r.note||"").trim()}),lbl=RT_OUTL[r.out];
  const patch={sent:null,routeLog:(t.routeLog||[]).concat([rec]),status:r.done?"done":"doing",completedAt:r.done?Date.now():0,
    comments:rtComment(t,`Response from ${rtWho(s)} received ${fmtISO(r.back)}: ${lbl}.${rec.outNote?`\n${rec.outNote}`:""}`)};
  setF("tasks",t.id,patch,0);
  rtPolHist(t,"Response",`${s.kind==="approval"?"Approval":"Review"} response from ${rtWho(s)}: ${lbl}${rec.outNote?`. ${rec.outNote}`:""}`);
  const p=rtPolicyOf(t);ui.tm.resp=null;
  if(p&&r.out==="changes"&&["Approved"].includes(p.stage))setF("policies",p.id,{stage:"Needs update",note:"Needs update",history:polHist(get("policies",p.id),{kind:"Stage",v:p.version,summary:`${p.stage} → Needs update (changes requested by ${s.to})`})},0);
  if(p&&(r.out==="approved"||r.out==="nochange"||r.out==="minor")){
    const mode=r.out==="approved"?"approve":"review";closeTM();
    openPol(p.id,false,mode);
    if(mode==="review"){ui.pol.act={force:"review",outcome:r.out==="minor"?"minor":"same",by:s.to,date:r.back,summary:rec.outNote||""};renderPeek()}
    else{ui.pol.act={force:"approve",level:s.role||p.approval,date:r.back,summary:rec.outNote||""};renderPeek()}
    toast(`Response saved. Check the details and confirm to update the register.`);return}
  renderAll();toast(`Response saved: ${lbl}`);
}

/* ---- dialog events ---- */
TM.addEventListener("click",e=>{
  const t=get("tasks",ui.tm.id);if(!t)return;const b=e.target.closest("button,a");if(!b)return;
  if(b.dataset.rtdue){const f=ui.tm.send;if(!f)return;f.due=addWorkdays(f.on||todayISO(),+b.dataset.rtdue);renderTM();return}
  if(b.id==="rt-go"){e.stopPropagation();return rtSubmitSend()}
  if(b.id==="rt-cancel"){ui.tm.send=null;renderTM();return}
  if(b.id==="rt-resp"){const s=rtOpen(t);ui.tm.resp={out:"",back:todayISO(),note:"",done:false,err:""};renderTM();return}
  if(b.dataset.rtout){const r=ui.tm.resp;r.out=b.dataset.rtout;r.done=["approved","nochange","minor"].includes(r.out);r.err="";renderTM();return}
  if(b.id==="rt-rgo")return rtSubmitResp();
  if(b.id==="rt-rcancel"){ui.tm.resp=null;renderTM();return}
  if(b.id==="rt-edit"){const s=rtOpen(t);ui.tm.send=Object.assign({},s,{edit:true,err:""});renderTM();return}
  if(b.id==="rt-copy"){const s=rtOpen(t);rtCopy(`Subject: ${rtSubject(t,s,false)}\n\n${rtBody(t,s,false)}`);return}
  if(b.id==="rt-withdraw"){armed(b,()=>{const s=rtOpen(t);setF("tasks",t.id,{sent:null,status:"doing",routeLog:(t.routeLog||[]).concat([Object.assign({},s,{back:todayISO(),outcome:"withdrawn"})]),comments:rtComment(t,`Withdrew the ${s.kind} request sent to ${rtWho(s)}.`)},0);rtPolHist(t,"Response",`${s.kind==="approval"?"Approval":"Review"} request to ${rtWho(s)} withdrawn`);renderAll();toast("Request withdrawn")},"Confirm withdraw");return}
  if(b.dataset.rtchase){const s=rtOpen(t);if(!s)return;const ns=Object.assign({},s,{chases:(s.chases||[]).concat([todayISO()])});setF("tasks",t.id,{sent:ns,comments:rtComment(t,`Reminder sent to ${rtWho(s)}.`)},0);rtPolHist(t,"Reminder",`Reminder sent to ${rtWho(s)}`);setTimeout(()=>{renderAll();toast("Reminder logged")},50);return}
},true);
TM.addEventListener("input",e=>{const x=e.target;if(x.dataset.rt&&ui.tm.send){ui.tm.send[x.dataset.rt]=x.value;if(x.dataset.rt==="to"){const k=rtKnownPeople().find(p=>p.name===x.value.trim());if(k){if(k.email&&!ui.tm.send.email){ui.tm.send.email=k.email;const m=$("rt-email");if(m)m.value=k.email}if(k.role&&!ui.tm.send.role){ui.tm.send.role=k.role;const r=$("rt-role");if(r)r.value=k.role}}}e.stopPropagation()}
  if(x.dataset.rtr&&ui.tm.resp){ui.tm.resp[x.dataset.rtr]=x.type==="checkbox"?x.checked:x.value;e.stopPropagation()}},true);
TM.addEventListener("change",e=>{const x=e.target;
  if(x.dataset.rt&&ui.tm.send){ui.tm.send[x.dataset.rt]=x.value;e.stopPropagation();return}
  if(x.dataset.rtr&&ui.tm.resp){ui.tm.resp[x.dataset.rtr]=x.type==="checkbox"?x.checked:x.value;e.stopPropagation();return}
  if(x.dataset.tm==="status"&&(x.value==="review"||x.value==="approval")){e.stopPropagation();const t=get("tasks",ui.tm.id);if(t&&t.status===x.value&&t.sent){return}rtStartSend(ui.tm.id,x.value);return}},true);

/* ---- planner badges ---- */
function rtBadge(t){const s=rtOpen(t);if(!s)return"";const late=rtLate(s);
  return`<span class="rtbadge ${late?"late":""}" data-c="${late?"red":RT_KIND[s.kind].c}" title="${esc(RT_KIND[s.kind].l)} to ${esc(rtWho(s))} on ${esc(fmtISO(s.on))}. ${esc(rtDueText(s))}">${svg("send")}${esc(rtFirst(s.to)==="there"?"Sent":`With ${s.to}`)}${s.due?` · ${late?"overdue":esc(fmtShort(s.due).slice(0,5))}`:""}</span>`}

/* ---- policy register: tracker ---- */
function polRoute(p){const t=DB.tasks.find(x=>x.policyId===p.id&&rtOpen(x));return t?{t,s:t.sent}:null}
function polLastRound(p){let best=null;DB.tasks.filter(x=>x.policyId===p.id).forEach(t=>(t.routeLog||[]).forEach(r=>{if(!best||(r.back||"")>(best.back||""))best=Object.assign({task:t},r)}));return best}

/* unit cost: landed cost per unit from the print/merch order that supplied the stock */
function spOrderCosts(itemId){
  return DB.orders.filter(o=>o.itemId===itemId&&o.status!=="Cancelled"&&num(o.qty)>0&&orderTotal(o)!=null&&(num(o.received)>0||o.status==="Delivered"))
    .map(o=>({o,unit:orderTotal(o)/num(o.qty),date:o.receivedDate||o.orderDate||isoOf(new Date(o.created||Date.now()))})).sort((a,b)=>a.date.localeCompare(b.date));
}
function spUnitCost(itemId,asOf){
  const L=spOrderCosts(itemId);
  if(L.length){const before=L.filter(x=>x.date<=(asOf||"9999"));const x=before.length?before[before.length-1]:L[0];return{v:x.unit,src:`${x.o.ref}${x.o.supplier?` · ${x.o.supplier}`:""}`,kind:"order"}}
  const it=get("items",itemId),u=it?parseFloat(it.unitCost):NaN;

}

/* ---- usage & reorder maths ---- */
function spLead(it){
  const n=parseFloat(it.leadDays);if(!isNaN(n)&&n>0)return{d:Math.round(n),src:"Set on item"};
  const past=DB.orders.filter(o=>o.itemId===it.id&&o.orderDate&&o.receivedDate&&o.receivedDate>=o.orderDate).map(o=>spDays(o.orderDate,o.receivedDate));
  if(past.length)return{d:Math.max(1,Math.round(past.reduce((a,b)=>a+b,0)/past.length)),src:`Average of ${past.length} past order${past.length===1?"":"s"}`};
  return{d:SP_DEF_LEAD,src:"Default"};
}
function spRound(q,it){if(q<=0)return 0;const p=parseInt(it.packSize,10);if(p>1)return Math.ceil(q/p)*p;return q>=100?Math.ceil(q/50)*50:Math.ceil(q/10)*10}
function spPlan(it,sm,oo){
  const R=ui.stock.rp,today=todayISO(),from=addDays(today,-R.win);
  const mv=DB.moves.filter(m=>m.itemId===it.id);
  const first=mv.map(spDate).filter(Boolean).sort()[0]||today;
  const used=mv.filter(m=>counts(m)&&spDate(m)>=from&&spDate(m)<=today).reduce((a,m)=>a+takenOf(m),0);
  const span=Math.max(14,Math.min(R.win,spDays(first,today)||0));
  const rate=Math.max(0,used)/span; /* units per day */
  const oh=Math.max(0,sm[it.id]||0),on=oo[it.id]||0,lead=spLead(it),cover=R.cover*7;
  const daysLeft=rate>0?oh/rate:null,runOut=daysLeft!=null?addDays(today,Math.floor(daysLeft)):"";
  const rop=Math.ceil(rate*(lead.d+SP_SAFETY));
  const target=Math.ceil(rate*(lead.d+SP_SAFETY+cover));
  let sugg=spRound(Math.max(0,target-oh-on),it);
  const lvl=num(it.reorderLevel);
  if(rate===0&&lvl>0&&oh+on<=lvl)sugg=spRound(Math.max(lvl*2-oh-on,0),it);
  const orderBy=daysLeft!=null?addDays(today,Math.floor(daysLeft-lead.d-SP_SAFETY)):"";
  let st;
  if(oh<=0&&on<=0&&(rate>0||lvl>0))st="now";
  else if(rate===0)st=lvl>0&&oh+on<=lvl?"now":"idle";
  else if(oh+on<=rop||(lvl>0&&oh+on<=lvl))st=on>0&&oh+on>rop?"onorder":"now";
  else if(on>0&&oh<=rop)st="onorder";
  else if(orderBy&&spDays(today,orderBy)<=21)st="soon";
  else st="ok";
  if(st==="ok"||st==="idle"||st==="onorder")sugg=st==="onorder"?0:sugg;
  const uc=spUnitCost(it.id,today);
  return{it,used,rate,perMonth:rate*30.44,oh,on,lead,daysLeft,runOut,rop,sugg:st==="now"||st==="soon"?sugg:0,orderBy,st,uc,cost:uc.v!=null?(st==="now"||st==="soon"?sugg:0)*uc.v:null};
}

/* ---- event costs ---- */
function spEventCosts(){
  const st=ui.stock,g={};
  DB.moves.filter(counts).forEach(m=>{
    if(st.dept&&m.department!==st.dept)return;
    const name=(m.event||"").trim()||"No event recorded",key=name.toLowerCase(),d=spDate(m);
    const e=g[key]||(g[key]={name,first:"",last:"",units:0,cost:0,missing:new Set(),items:{},depts:{},people:new Set()});
    const t=takenOf(m);if(!t)return;
    const uc=spUnitCost(m.itemId,d),c=uc.v!=null?t*uc.v:0;
    e.units+=t;e.cost+=c;if(uc.v==null)e.missing.add(m.itemId);
    if(d){if(!e.first||d<e.first)e.first=d;if(d>e.last)e.last=d}
    const it=e.items[m.itemId]||(e.items[m.itemId]={units:0,cost:0,uc});it.units+=t;it.cost+=c;
    const dp=m.department||"Not recorded";e.depts[dp]=(e.depts[dp]||0)+c;
    if(m.personName)e.people.add(m.personName);
  });
  return Object.values(g).filter(e=>e.units!==0).sort((a,b)=>(b.last||"").localeCompare(a.last||""));
}
function renderCosts(){
  const st=ui.stock,q=st.q.trim().toLowerCase(),today=todayISO(),fy=spFY(today);
  let E=spEventCosts();
  if(st.from)E=E.filter(e=>(e.last||"")>=st.from);if(st.to)E=E.filter(e=>(e.first||"9999")<=st.to);
  if(q)E=E.filter(e=>e.name.toLowerCase().includes(q));
  if(!E.length)return`<div class="empty"><p class="big">No event costs yet</p><p>Costs appear once stock has been issued for an event and the item has a cost, either from a delivered print order or the unit cost on the item.</p></div>`;
  const real=E.filter(e=>e.name!=="No event recorded");
  const fyE=real.filter(e=>e.last&&spFY(e.last)===fy),fyCost=fyE.reduce((a,e)=>a+e.cost,0);
  const mo=today.slice(0,7),moCost=real.filter(e=>(e.last||"").slice(0,7)===mo).reduce((a,e)=>a+e.cost,0);
  const avg=real.length?real.reduce((a,e)=>a+e.cost,0)/real.length:0,top=real.slice().sort((a,b)=>b.cost-a.cost)[0];
  const missing=new Set();E.forEach(e=>e.missing.forEach(i=>missing.add(i)));
  const dTot={};E.forEach(e=>Object.entries(e.depts).forEach(([d,v])=>dTot[d]=(dTot[d]||0)+v));const dMax=Math.max(1,...Object.values(dTot));
  const cards=[{l:`Spent on events, ${spFYLabel(fy)}`,v:money(fyCost),c:"blue",i:"chart",f:`<span>${fyE.length} event${fyE.length===1?"":"s"} since 1 July</span>`},
    {l:"This month",v:money(moCost),c:"purple",i:"cal",f:`<span>${new Date(today+"T00:00:00").toLocaleDateString("en-AU",{month:"long"})}</span>`},
    {l:"Average per event",v:money(avg),c:"green",i:"users",f:`<span>Across ${real.length} event${real.length===1?"":"s"}</span>`},
    {l:"Most expensive",v:top?money(top.cost):"—",c:"orange",i:"alert",f:`<span>${top?esc(top.name):""}</span>`}];
  const open=ui.stock.costOpen||{};
  const rows=E.map(e=>{const k=e.name.toLowerCase(),isOpen=!!open[k],when=e.first&&e.first!==e.last?`${fmtShort(e.first)} – ${fmtShort(e.last)}`:fmtShort(e.last||e.first);
    return`<tr class="sp-ev" data-spev="${esc(k)}"><td class="name"><span class="sp-evn">${svg(isOpen?"chevD":"chevR")}<span>${esc(e.name)}</span></span></td><td>${esc(when||"—")}</td><td class="oh">${Object.keys(e.items).length}</td><td class="oh">${fmtN(e.units)}</td><td class="oh">${money(e.cost)}</td><td class="oh">${e.units?money(e.cost/e.units):"—"}</td>
      <td>${Object.entries(e.depts).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).map(([d,v])=>`<span class="tag" data-c="${deptOf(d).c}">${esc(d)} ${money(v)}</span>`).join(" ")||"—"}</td><td>${e.missing.size?`<span class="rv-soon">${e.missing.size} without cost</span>`:'<span class="faint">Complete</span>'}</td></tr>
      ${isOpen?Object.entries(e.items).map(([id,v])=>`<tr class="sp-sub-row" data-item="${id}"><td class="name">${esc(itemName(id))}</td><td class="muted" colspan="2">${v.uc.v!=null?`${money(v.uc.v)} each · ${esc(v.uc.src)}`:'<span class="rv-soon">No cost: add a unit cost on the item</span>'}</td><td class="oh">${fmtN(v.units)}</td><td class="oh">${v.uc.v!=null?money(v.cost):"—"}</td><td colspan="3"></td></tr>`).join(""):""}`}).join("");
  return`<div class="scards">${cards.map(c=>`<div class="scard"><div class="scard-top"><span class="tile" data-c="${c.c}">${svg(c.i)}</span><span class="v">${esc(String(c.v))}</span></div><div class="l">${esc(c.l)}</div><div class="f">${c.f}</div></div>`).join("")}</div>
  ${missing.size?`<div class="sp-warn">${svg("alert")}<div><b>${missing.size} item${missing.size===1?" has":"s have"} no cost</b>, so some events are under-counted: ${[...missing].slice(0,5).map(id=>`<button class="link" data-item="${id}">${esc(itemName(id))}</button>`).join(", ")}${missing.size>5?" and more":""}. Add a unit cost on the item, or record the cost on its print order.</div></div>`:""}
  <section class="sp-block"><div class="panel-h"><h2>Cost per event</h2><span class="spacer"></span><button class="ctl" id="sp-cexport">Export</button></div>
    <div class="tablewrap"><table class="sp-table sp-costs"><colgroup><col><col style="width:116px"><col style="width:60px"><col style="width:72px"><col style="width:100px"><col style="width:84px"><col style="width:270px"><col style="width:128px"></colgroup>
    <thead><tr><th><button>Event</button></th><th><button>Date</button></th><th><button>Items</button></th><th><button>Units</button></th><th><button>Cost</button></th><th><button>Per unit</button></th><th><button>By department</button></th><th><button>Costing</button></th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="sp-how">Cost = units used (issued less returned) × the landed cost per unit from the print or merch order that supplied the stock, including setup and freight. If an item has no delivered order with a cost, the unit cost on the item is used.</p></section>
  <section class="sp-block"><div class="panel-h"><h2>By department</h2><span class="muted" style="font-size:13px">All events shown</span></div><div class="sp-dept">${Object.entries(dTot).sort((a,b)=>b[1]-a[1]).map(([d,v])=>`<div class="hbar" data-c="${deptOf(d).c}"><span>${esc(d)}</span><span class="track"><span class="fill" style="display:block;width:${v/dMax*100}%"></span></span><span class="r" style="min-width:80px">${money(v)}</span></div>`).join("")||'<div class="nodata">No costed usage yet.</div>'}</div></section>`;
}

/* ---- item peek additions ---- */
function spItemBox(it){
  const sm=stockMap(),oo=onOrderMap(),p=spPlan(it,sm,oo),S=SP_ST[p.st];
  return`<div class="grp">Reordering</div>
  <div class="props">
    <div class="plabel">Status</div><div class="pval">${tag(S.l,S.c,true)}${p.sugg?`<span class="faint" style="font-size:12.5px;white-space:nowrap">Suggest ${fmtN(p.sugg)}${p.orderBy?`, order by ${esc(p.orderBy<=todayISO()?"today":fmtShort(p.orderBy))}`:""}</span>`:""}</div>
    <div class="plabel">Usage</div><div class="pval">${p.rate>0?`About ${fmtN(Math.round(p.perMonth))} a month · lasts ${spWeeks(p.daysLeft)}`:"No usage in the selected period"}</div>
    <div class="plabel">Lead time (days)</div><div class="pval"><input data-f="leadDays" inputmode="numeric" value="${esc(it.leadDays||"")}" placeholder="${p.lead.d} (${esc(p.lead.src.toLowerCase())})"></div>
    <div class="plabel">Order in multiples of</div><div class="pval"><input data-f="packSize" inputmode="numeric" value="${esc(it.packSize||"")}" placeholder="e.g. 250"></div>
    <div class="plabel">Cost per unit</div><div class="pval">${p.uc.v!=null?`${money(p.uc.v)} <span class="faint" style="font-size:12px;white-space:nowrap">${esc(p.uc.src)}</span>`:'<span class="faint">Not recorded</span>'}</div>
  </div>`;
}

/* ---- events ---- */
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.rp){ui.stock.rp[t.dataset.rp]=+t.value;spSaveRp();renderMain()}});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-sporder],[data-spev],#sp-export,#sp-cexport");if(!b)return;
  if(b.dataset.sporder){e.stopPropagation();const it=get("items",b.dataset.sporder),q=+b.dataset.spqty;if(!it)return;createOrder(it.id);const o=DB.orders.filter(x=>x.itemId===it.id).sort((a,c)=>(c.created||0)-(a.created||0))[0];
    if(o){const uc=spUnitCost(it.id,todayISO());setF("orders",o.id,{qty:String(q),unitCost:o.unitCost||(uc.v!=null?uc.v.toFixed(4).replace(/0+$/,"").replace(/\.$/,""):""),notes:`Suggested by the reorder planner: about ${fmtN(Math.round(spPlan(it,stockMap(),onOrderMap()).perMonth))} used a month.`},0);renderAll()}
    toast(`Order created for ${fmtN(q)} × ${it.name}`);return}
  if(b.dataset.spev!==undefined){if(e.target.closest("[data-item]"))return;e.stopPropagation();const o=ui.stock.costOpen=ui.stock.costOpen||{};o[b.dataset.spev]=!o[b.dataset.spev];renderMain();return}
  if(b.id==="sp-export"){const P=spPlans();save(`reorder-planner-${todayISO()}.csv`,csv(["Item","Category","Supplier","Status","On hand","On order",`Used in last ${ui.stock.rp.win} days`,"Used per month","Lasts (days)","Runs out","Lead time (days)","Lead time source","Suggested qty","Order by","Unit cost","Cost source","Estimated cost"],
    P.sort((a,b)=>SP_ST[a.st].o-SP_ST[b.st].o).map(p=>[p.it.name,p.it.category,p.it.supplier,SP_ST[p.st].l,p.oh,p.on,p.used,Math.round(p.perMonth),p.daysLeft!=null?Math.floor(p.daysLeft):"",p.runOut?fmtShort(p.runOut):"",p.lead.d,p.lead.src,p.sugg||"",p.sugg&&p.orderBy?fmtShort(p.orderBy):"",p.uc.v!=null?p.uc.v.toFixed(2):"",p.uc.src,p.cost!=null&&p.sugg?p.cost.toFixed(2):""])),"text/csv");return}
  if(b.id==="sp-cexport"){const E=spEventCosts();const rows=[];E.forEach(ev=>Object.entries(ev.items).forEach(([id,v])=>rows.push([ev.name,ev.first?fmtShort(ev.first):"",ev.last?fmtShort(ev.last):"",itemName(id),v.units,v.uc.v!=null?v.uc.v.toFixed(2):"",v.uc.v!=null?v.cost.toFixed(2):"",v.uc.src])));
    save(`event-costs-${todayISO()}.csv`,csv(["Event","First date","Last date","Item","Units used","Unit cost","Cost","Cost source"],rows),"text/csv");return}
},true);

/* boot */
applyTheme();
Object.keys(STORES).forEach(s=>{DB[s]=loadLocal(s)});
renderAll();
connect();
(async()=>{if(window.claude&&typeof window.claude.use==="function"){try{dl=await window.claude.use("downloads")}catch(e){}}})();
setInterval(()=>{if(document.visibilityState==="visible"&&!ui.peek)renderMain()},60000);
})();
</script>
<script>
(function(){try{var n=localStorage.getItem("docreg.owner");if(n){document.getElementById("meName").textContent=n;document.getElementById("meAv").textContent=n.trim().charAt(0).toUpperCase()}}catch(e){}})();
</script>
</body>
