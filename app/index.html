<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workspace – documents, policies, stock and planning</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F2F7;--side:rgba(242,242,247,.78);--bar:rgba(255,255,255,.72);--card:#FFFFFF;--card2:#F2F2F7;--text:#1D1D1F;--muted:#6E6E73;--faint:#AEAEB2;
  --line:rgba(60,60,67,.12);--line2:rgba(60,60,67,.2);--hover:rgba(0,0,0,.035);--sel:rgba(0,0,0,.075);--input:rgba(118,118,128,.12);
  --accent:#007AFF;--accent-soft:rgba(0,122,255,.12);--danger:#FF3B30;--warn:#FF9500;--ok:#34C759;
  --cshadow:0 1px 2px rgba(0,0,0,.04),0 0 0 .5px rgba(0,0,0,.04);
  --shadow:0 24px 60px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.08);
  --s-gray:#8E8E93;--s-brown:#A2845E;--s-orange:#FF9500;--s-yellow:#FFCC00;--s-green:#34C759;--s-blue:#007AFF;--s-purple:#AF52DE;--s-pink:#FF2D55;--s-red:#FF3B30;--s-teal:#30B0C7;
  --k-gray:#6E6E73;--k-brown:#86694A;--k-orange:#C25E00;--k-yellow:#9A7500;--k-green:#248A3D;--k-blue:#0062CC;--k-purple:#8E3FB8;--k-pink:#C7163F;--k-red:#D70015;--k-teal:#0F7A8C;
  --tint:15%;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000;--side:rgba(28,28,30,.72);--bar:rgba(22,22,23,.72);--card:#1C1C1E;--card2:#2C2C2E;--text:#F5F5F7;--muted:#98989D;--faint:#636366;
  --line:rgba(84,84,88,.42);--line2:rgba(84,84,88,.65);--hover:rgba(255,255,255,.05);--sel:rgba(255,255,255,.1);--input:rgba(118,118,128,.24);
  --accent:#0A84FF;--accent-soft:rgba(10,132,255,.2);--danger:#FF453A;--warn:#FF9F0A;--ok:#30D158;--cshadow:none;--shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.1);
  --s-gray:#8E8E93;--s-brown:#AC8E68;--s-orange:#FF9F0A;--s-yellow:#FFD60A;--s-green:#30D158;--s-blue:#0A84FF;--s-purple:#BF5AF2;--s-pink:#FF375F;--s-red:#FF453A;--s-teal:#40C8E0;
  --k-gray:#AEAEB2;--k-brown:#C4A57F;--k-orange:#FFB340;--k-yellow:#FFE15A;--k-green:#4CE07A;--k-blue:#64B0FF;--k-purple:#D18AF8;--k-pink:#FF6A87;--k-red:#FF6961;--k-teal:#70D7EA;
  --tint:24%;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#000000;--side:rgba(28,28,30,.72);--bar:rgba(22,22,23,.72);--card:#1C1C1E;--card2:#2C2C2E;--text:#F5F5F7;--muted:#98989D;--faint:#636366;
  --line:rgba(84,84,88,.42);--line2:rgba(84,84,88,.65);--hover:rgba(255,255,255,.05);--sel:rgba(255,255,255,.1);--input:rgba(118,118,128,.24);
  --accent:#0A84FF;--accent-soft:rgba(10,132,255,.2);--danger:#FF453A;--warn:#FF9F0A;--ok:#30D158;--cshadow:none;--shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.1);
  --s-gray:#8E8E93;--s-brown:#AC8E68;--s-orange:#FF9F0A;--s-yellow:#FFD60A;--s-green:#30D158;--s-blue:#0A84FF;--s-purple:#BF5AF2;--s-pink:#FF375F;--s-red:#FF453A;--s-teal:#40C8E0;
  --k-gray:#AEAEB2;--k-brown:#C4A57F;--k-orange:#FFB340;--k-yellow:#FFE15A;--k-green:#4CE07A;--k-blue:#64B0FF;--k-purple:#D18AF8;--k-pink:#FF6A87;--k-red:#FF6961;--k-teal:#70D7EA;
  --tint:24%;color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Inter",ui-sans-serif,"Segoe UI",Arial,sans-serif;letter-spacing:-.006em;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px;border-radius:8px}
svg.i{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.faint{color:var(--faint)}.muted{color:var(--muted)}.hide{display:none!important}
.app{display:flex;height:100%;overflow:hidden}
[data-c]{--ts:var(--s-gray);--ti:var(--k-gray)}
[data-c=gray]{--ts:var(--s-gray);--ti:var(--k-gray)}[data-c=brown]{--ts:var(--s-brown);--ti:var(--k-brown)}[data-c=orange]{--ts:var(--s-orange);--ti:var(--k-orange)}
[data-c=yellow]{--ts:var(--s-yellow);--ti:var(--k-yellow)}[data-c=green]{--ts:var(--s-green);--ti:var(--k-green)}[data-c=blue]{--ts:var(--s-blue);--ti:var(--k-blue)}
[data-c=purple]{--ts:var(--s-purple);--ti:var(--k-purple)}[data-c=pink]{--ts:var(--s-pink);--ti:var(--k-pink)}[data-c=red]{--ts:var(--s-red);--ti:var(--k-red)}[data-c=teal]{--ts:var(--s-teal);--ti:var(--k-teal)}
[data-c]{--tb:color-mix(in srgb,var(--ts) var(--tint),transparent)}

/* sidebar */
.side{width:260px;flex-shrink:0;background:var(--side);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);border-right:.5px solid var(--line2);display:flex;flex-direction:column;overflow-y:auto;padding:0 10px 14px}
.ws{display:flex;align-items:center;gap:10px;height:56px;padding:0 10px;font-size:17px;font-weight:600;flex-shrink:0}
.ws-mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(180deg,#5AA9FF,#007AFF);display:grid;place-items:center;color:#fff}
.ws-mark svg.i{width:15px;height:15px;stroke-width:2.2}
.side h4{margin:16px 10px 4px;font-size:11px;font-weight:600;color:var(--muted)}
.navgrp{padding:0}
.nav{position:relative;display:flex;align-items:center;gap:9px;width:100%;padding:0 10px;border-radius:8px;color:var(--text);text-align:left;min-height:30px;font-weight:400;font-size:13.5px}
.nav:hover{background:var(--hover)}
.nav svg.i{color:var(--accent)}
.nav .n{margin-left:auto;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav .n.alert{color:var(--danger);font-weight:600}
.nav.sec-nav{min-height:32px;font-weight:500}
.nav.on{background:var(--sel)}
.nav.sub{padding-left:37px;color:var(--text)}
.nav.sub.flat{padding-left:10px}
.nav.sub.on{background:var(--sel);font-weight:500}
.nav .ldot{width:20px;height:20px;border-radius:50%;background:var(--ts);display:grid;place-items:center;color:#fff;flex-shrink:0}
.nav .ldot svg.i{width:11px;height:11px;color:#fff;stroke-width:2.6}
.cdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--ts)}
.addlist{color:var(--muted)!important}
.addlist svg.i{color:var(--muted)!important}
.side-foot{margin-top:auto;padding:16px 10px 0}
.sync{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync i.cloud{background:var(--ok)}

/* toolbar bar */
.main{flex:1;min-width:0;overflow-y:auto}
.topbar{display:flex;align-items:center;gap:12px;height:52px;padding:0 24px;position:sticky;top:0;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);z-index:6;border-bottom:.5px solid var(--line2)}
#menuBtn{display:none;color:var(--accent)}
.crumb{font-weight:600;font-size:13.5px}
.crumb span{color:var(--muted);font-weight:400}
.theme,.seg,.tabs{display:inline-flex;background:var(--input);border-radius:9px;padding:2px;gap:0;position:relative}
.theme button,.seg button,.tab{display:flex;align-items:center;justify-content:center;gap:5px;padding:4px 12px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--text);min-height:26px;position:relative}
.theme button svg.i{width:14px;height:14px}
.theme button.on,.seg button.on,.tab.on{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04),0 0 0 .5px rgba(0,0,0,.04)}
:root[data-theme="dark"] .theme button.on,:root[data-theme="dark"] .seg button.on,:root[data-theme="dark"] .tab.on{background:#636366}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .theme button.on,:root:not([data-theme="light"]) .seg button.on,:root:not([data-theme="light"]) .tab.on{background:#636366}}
.me{display:flex;align-items:center;gap:10px;padding-left:12px}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(180deg,#A0A7B4,#6E7480);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px}
.me b{display:block;font-size:13px;font-weight:600;line-height:1.2}
.me small{color:var(--muted);font-size:11.5px}

/* page */
.page{max-width:2200px;margin:0 auto;padding:26px clamp(16px,2.2vw,40px) 90px}
.pagehead{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:34px;line-height:1.12;font-weight:700;margin:0;letter-spacing:-.022em}
.lede{color:var(--muted);margin:6px 0 0;max-width:70ch;font-size:15px}
.panel{background:var(--card);border-radius:14px;box-shadow:var(--cshadow);padding:18px 20px}
.panel+.panel{margin-top:20px}
.panel-h{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.panel-h h2{font-size:19px;font-weight:700;margin:0;letter-spacing:-.015em}
.panel-h .link{margin-left:auto;font-size:13.5px}

/* widgets (Reminders-style tiles) */
.scards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.scard{background:var(--card);border-radius:14px;box-shadow:var(--cshadow);padding:12px 14px 12px;text-align:left;display:block;width:100%;transition:transform .12s}
button.scard:active{transform:scale(.98)}
button.scard:hover{background:color-mix(in srgb,var(--card) 92%,var(--text))}
.scard-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.tile{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:var(--ts);color:#fff}
.tile svg.i{width:17px;height:17px;stroke-width:2.2}
.scard .v{font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.scard .v.alert{color:var(--danger)}
.scard .l{color:var(--muted);font-weight:600;font-size:14.5px;margin-top:10px}
.scard .f{margin-top:2px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.up{color:var(--ok);font-weight:600}.down{color:var(--danger);font-weight:600}

/* dashboard grid */
.dgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}
.s8{grid-column:span 8}.s4{grid-column:span 4}.s6{grid-column:span 6}.s7{grid-column:span 7}.s5{grid-column:span 5}.s12{grid-column:span 12}
.dgrid .panel+.panel{margin-top:0}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .gl{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.donutwrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.donut-c{font-size:26px;font-weight:700;fill:var(--text)!important}
.dlist{list-style:none;margin:0;padding:0;width:100%}
.dlist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:.5px solid var(--line);font-size:13.5px}
.dlist li:last-child{border-bottom:0}
.dlist .r{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.hbar{display:grid;grid-template-columns:150px 1fr 36px;gap:12px;align-items:center;padding:7px 0;font-size:13.5px}
.hbar .track{height:8px;border-radius:4px;background:var(--input);overflow:hidden}
.hbar .fill{height:100%;border-radius:4px;background:var(--ts)}
.hbar .r{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.rowlink{cursor:pointer;border-radius:6px}
.hgrp{font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 2px}
.hgrp:first-child{margin-top:0}
.rowlink:hover{background:var(--hover)}
.nodata{color:var(--muted);text-align:center;padding:36px 0;font-size:13.5px}

/* controls */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.spacer{flex:1}
.ctl{height:30px;border-radius:8px;border:0;background:var(--input);padding:0 11px;color:var(--text);font-weight:500;font-size:13px}
.ctl:hover{background:color-mix(in srgb,var(--input) 100%,var(--text) 6%)}
select.ctl{appearance:none;-webkit-appearance:none;padding-right:26px;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 13px) 13px,calc(100% - 9px) 13px;background-size:4px 4px;background-repeat:no-repeat}
.ctl.set{background-color:var(--accent-soft);color:var(--accent)}
select.ctl option{background:var(--card);color:var(--text)}
.peek-bar .ctl,td .ctl{background:transparent;color:var(--accent);height:30px}
.peek-bar .ctl:hover,td .ctl:hover{background:var(--hover)}
.search{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:9px;background:var(--input);color:var(--muted);min-width:230px}
.search svg.i{width:15px;height:15px}
.search input{border:0;background:transparent;outline:0;width:100%;color:var(--text)}
.search input::placeholder{color:var(--muted)}
.btn{height:32px;padding:0 15px;border-radius:980px;font-weight:500;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;white-space:nowrap}
.btn svg.i{width:15px;height:15px;stroke-width:2.2}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{filter:brightness(1.08)}
.btn-primary:active{filter:brightness(.92)}
.btn-primary:disabled{opacity:.4;cursor:default;filter:none}
.btn-quiet{color:var(--accent);background:var(--accent-soft)}
.btn-quiet:hover{background:color-mix(in srgb,var(--accent) 20%,transparent)}
.popwrap{position:relative}
.pop{position:absolute;right:0;top:36px;background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);box-shadow:var(--shadow);border-radius:12px;padding:6px;z-index:12;min-width:220px}
.pop label{display:flex;align-items:center;gap:9px;padding:5px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
.pop label:hover{background:var(--accent);color:#fff}
.pop .ph{font-size:11.5px;color:var(--muted);padding:4px 10px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:4px 0 6px}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:500;padding:3px 5px 3px 10px;border-radius:980px;background:var(--accent-soft);color:var(--accent)}
.chip button{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;color:inherit;font-size:9px;background:color-mix(in srgb,var(--accent) 18%,transparent)}

/* tags */
.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--tb);color:var(--ti)}
.tag.pill{border-radius:980px}
.tag.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ts)}
.ver{font-variant-numeric:tabular-nums}
.ref{font-variant-numeric:tabular-nums;font-weight:600}
.due{font-size:11.5px;font-weight:600;margin-left:8px}
.due.over{color:var(--danger)}.due.soon{color:var(--warn)}
.lock{font-size:11px;color:var(--warn);margin-left:8px;font-weight:600}

/* table */
.tablewrap{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:760px}
th{font-weight:600;color:var(--muted);text-align:left;font-size:12px;padding:0;white-space:nowrap;border-bottom:.5px solid var(--line2)}
th button{width:100%;text-align:left;padding:8px 12px;display:flex;align-items:center;gap:4px;color:inherit;font-weight:600}
th button:hover{color:var(--text)}
th .arrow{font-size:8px;color:var(--accent)}
td{padding:0 12px;height:44px;border-bottom:.5px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--hover)}
tbody tr.open td{background:var(--accent-soft)}
td.name{font-weight:500;max-width:380px}
.addrow{display:flex;align-items:center;gap:8px;width:100%;padding:11px 12px;color:var(--accent);font-weight:500;text-align:left}
.addrow:hover{background:var(--hover)}
.count{padding:8px 12px 0;color:var(--muted);font-size:12px}

/* board */
.board{display:flex;gap:14px;overflow-x:auto;padding:6px 0 4px;align-items:flex-start}
.col{flex:0 0 280px;border-radius:14px;padding:10px;background:var(--card2);min-height:140px}
.col.over{outline:2px solid var(--accent);outline-offset:-2px}
.col-head{display:flex;align-items:center;gap:8px;padding:2px 4px 10px}
.col-head .n{color:var(--muted);font-size:12px}
.card{display:block;width:100%;text-align:left;background:var(--card);border-radius:10px;padding:11px 13px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 0 0 .5px var(--line)}
.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.08),0 0 0 .5px var(--line2)}
.card.dragging{opacity:.4}
.card-t{font-weight:500;margin-bottom:8px;white-space:normal;line-height:1.35}
.card-m{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.col-add{width:100%;text-align:left;padding:6px 8px;border-radius:8px;color:var(--accent);font-weight:500;font-size:13px}
.col-add:hover{background:var(--hover)}
.empty{padding:56px 8px;text-align:center;color:var(--muted)}
.empty .big{font-size:20px;color:var(--text);font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
.empty p{margin:0 0 16px}
.link{color:var(--accent);font-weight:400}
.link:hover{text-decoration:underline}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.peek{position:fixed;top:10px;right:10px;bottom:10px;width:min(720px,calc(100% - 20px));background:var(--bg);box-shadow:var(--shadow);z-index:21;border-radius:16px;overflow:hidden;transform:translateX(calc(100% + 24px));transition:transform .32s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column}
.peek.on{transform:none}
.peek-bar{display:flex;align-items:center;gap:2px;padding:10px 12px;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:.5px solid var(--line2)}
.peek-body{overflow-y:auto;padding:22px 26px 80px;flex:1}
.idgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin-bottom:22px;border-radius:12px;overflow:hidden;background:var(--line)}
.idcell{padding:10px 14px;min-width:0;background:var(--card)}
.idcell.cur{background:color-mix(in srgb,var(--accent) 9%,var(--card))}
.idcell label{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-bottom:1px}
.idcell input{width:100%;border:0;outline:0;background:transparent;font-size:18px;font-weight:600;padding:2px 0;font-variant-numeric:tabular-nums;min-width:0}
.idcell input::placeholder{color:var(--faint);font-weight:400;font-size:14px}
.idcell .hint{font-size:11px;min-height:15px}
.peek-title{width:100%;border:0;outline:0;background:transparent;resize:none;font-size:26px;font-weight:700;line-height:1.2;padding:0;margin:0 0 12px;overflow:hidden;letter-spacing:-.02em}
.peek-title::placeholder{color:var(--faint)}
.statusrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.statusrow select{appearance:none;-webkit-appearance:none;border:0;border-radius:980px;height:26px;padding:0 13px;font-size:12.5px;font-weight:600;cursor:pointer;background:var(--tb);color:var(--ti)}
.checkout{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 14px;border-radius:12px;background:color-mix(in srgb,var(--s-orange) var(--tint),transparent);color:var(--k-orange);margin:14px 0 4px;font-size:13px;font-weight:500}
.checkout .spacer{flex:1}
.checkout button{font-weight:600;color:inherit}
.grp{font-size:12px;color:var(--muted);margin:22px 14px 6px;font-weight:400;text-transform:uppercase;letter-spacing:.02em}
.props{display:grid;grid-template-columns:160px 1fr;background:var(--card);border-radius:12px;overflow:hidden}
.plabel{display:flex;align-items:center;padding:0 14px;min-height:42px;border-bottom:.5px solid var(--line)}
.pval{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-height:42px;padding:0 14px 0 4px;min-width:0;border-bottom:.5px solid var(--line);color:var(--muted)}
.props>div:nth-last-child(-n+2){border-bottom:0}
.pval input,.pval select{border:0;outline:0;background:transparent;width:100%;padding:8px 0;min-width:0;color:var(--text);text-align:right}
.pval input[type=date],.pval input[type=time]{text-align:right}
.pval select{cursor:pointer;text-align:right;text-align-last:right}
.pval select option{background:var(--card);color:var(--text)}
.pval input::placeholder{color:var(--faint)}
.pval.cat{justify-content:flex-end}
.pval.cat select{width:auto;max-width:100%;border-radius:6px;padding:3px 9px;background:var(--tb);color:var(--ti);font-size:12.5px;font-weight:600;direction:ltr}
.pval a{color:var(--accent);font-size:13px;white-space:nowrap;text-decoration:none}
.pval .tag{cursor:pointer}
.sec{font-size:20px;font-weight:700;margin:28px 0 10px;display:flex;align-items:baseline;gap:8px;letter-spacing:-.015em}
.sec .sub{font-weight:400;color:var(--muted);font-size:13px;letter-spacing:0}
.notes{width:100%;border:0;border-radius:12px;outline:0;background:var(--card);resize:none;min-height:80px;line-height:1.55;padding:12px 14px;overflow:hidden}
.notes::placeholder{color:var(--faint)}
.logform,.actbox{border-radius:12px;padding:14px;margin-bottom:16px;background:var(--card)}
.seg{margin-bottom:12px;flex-wrap:wrap}
.seg .v{font-variant-numeric:tabular-nums;color:var(--muted);margin-left:5px}
.logform textarea{width:100%;border:0;border-radius:9px;background:var(--input);padding:9px 11px;resize:vertical;min-height:66px;outline:0}
.logrow{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.logrow input{border:0;border-radius:9px;background:var(--input);height:32px;padding:0 11px;outline:0;min-width:0}
.logrow .by{flex:1;min-width:120px}
.logform textarea:focus,.logrow input:focus,.fi:focus{box-shadow:0 0 0 3.5px color-mix(in srgb,var(--accent) 40%,transparent)}
.timeline{list-style:none;margin:0;padding:6px 14px;background:var(--card);border-radius:12px}
.timeline li{display:grid;grid-template-columns:60px 1fr;gap:12px;padding:10px 0;position:relative}
.timeline li::before{content:"";position:absolute;left:29px;top:34px;bottom:-10px;width:1.5px;background:var(--line2)}
.timeline li:last-child::before{display:none}
.vpill{justify-self:center;align-self:start;font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:980px;background:var(--input);position:relative;z-index:1}
.vpill.major{background:var(--accent);color:#fff}
.vpill.minor{background:var(--accent-soft);color:var(--accent)}
.vpill.event{color:var(--muted);font-weight:500;background:var(--card2)}
.tl-head{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.tl-head strong{color:var(--text);font-weight:600}
.tl-sum{margin:2px 0 0;white-space:pre-wrap;line-height:1.5}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translate(-50%,-12px);background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);color:var(--text);box-shadow:var(--shadow);padding:10px 18px;border-radius:980px;font-size:13px;font-weight:500;opacity:0;transition:.25s cubic-bezier(.32,.72,0,1);pointer-events:none;z-index:40;max-width:90%}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* stock */
.qty{font-variant-numeric:tabular-nums;font-weight:600}
.qty.neg{color:var(--danger)}.qty.pos{color:var(--ok)}
.oh{font-variant-numeric:tabular-nums;font-weight:600}
.fi{border:0;border-radius:9px;background:var(--input);height:34px;padding:0 11px;outline:0;min-width:0;width:100%}
.fl{display:block;font-size:12px;color:var(--muted);margin:0 0 4px 2px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.err{color:var(--danger);font-size:13px;margin-top:10px}
.actfoot{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.evcard{border-radius:12px;padding:14px 16px 6px;margin:0 0 12px;background:var(--card2)}
.evhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.evhead h3{margin:0;font-size:16px;font-weight:600}
.evpeople{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px}
table.mini{min-width:0;width:100%;table-layout:fixed}
table.mini td,table.mini th{max-width:none}
table.mini th button{padding-left:10px;padding-right:10px}
table.mini td{padding:0 10px}
.dgrid>.panel{min-width:0;overflow:hidden}
.dgrid{grid-auto-flow:row dense}
table.mini td{height:40px}
.evcard table td{border-color:var(--line2)}
.deptgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0 20px}
.deptcard{border-radius:12px;padding:12px 14px;background:var(--card2)}
.deptcard .big{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:6px}
.addperson{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:4px 0}
.addperson .fi{width:auto;flex:1;min-width:180px}
.addperson select.fi{flex:0 1 240px}
.cellin{border:0;border-radius:7px;background:transparent;height:30px;padding:0 8px;outline:0;width:100%;min-width:130px}
.cellin:hover{background:var(--input)}
.cellin:focus{background:var(--input);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.cnt{width:96px;text-align:right;font-variant-numeric:tabular-nums}
.line{display:grid;grid-template-columns:minmax(0,1fr) 96px 32px;gap:8px;margin-bottom:8px;align-items:center}
.iconbtn{width:30px;height:30px;border-radius:50%;color:var(--muted);display:grid;place-items:center}
.iconbtn:hover{background:var(--hover);color:var(--danger)}
tr.rev td{opacity:.45}
.rev .qty{text-decoration:line-through}
.mvlist{list-style:none;margin:0;padding:0 14px;background:var(--card);border-radius:12px}
.mvlist li{display:grid;grid-template-columns:76px 1fr auto;gap:12px;padding:11px 0;border-bottom:.5px solid var(--line);align-items:start}
.mvlist li:last-child{border-bottom:0}
.mvlist li.rev{opacity:.45}
.mvlist .qty{text-align:right;font-size:15px}
.mvmeta{font-size:12.5px;color:var(--muted)}
.armed{color:#fff!important;background:var(--danger)!important;border-radius:980px}
.countbar{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;padding:16px 0 8px}
.countbar .fi{width:auto}
.diff.neg{color:var(--danger)}.diff.pos{color:var(--ok)}
.togglelink{color:var(--accent);font-size:12.5px;padding:8px 12px 0}
/* print orders */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 8px}
.step{height:28px;padding:0 12px;border-radius:980px;font-size:12.5px;font-weight:600;background:var(--input);color:var(--muted)}
.step:hover{color:var(--text)}
.step.done{background:var(--tb);color:var(--ti)}
.step.cur{background:var(--ts);color:#fff}
.otitle{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin:0 0 10px}
.prog{display:inline-block;width:70px;height:6px;border-radius:3px;background:var(--input);overflow:hidden;vertical-align:middle;margin-right:8px}
.prog span{display:block;height:100%;background:var(--ok)}
.cancelbar{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;background:color-mix(in srgb,var(--s-red) var(--tint),transparent);color:var(--k-red);font-size:13px;font-weight:500;margin:6px 0}
.cancelbar button{font-weight:600;color:inherit;margin-left:auto}
.peek .actbox .fi,.peek .logform .fi{background:var(--input)}

/* planner */
.qadd{display:flex;align-items:center;gap:10px;padding:6px 6px 12px;border-bottom:.5px solid var(--line);margin-bottom:6px;flex-wrap:wrap}
.qadd input.qt{flex:1;min-width:200px;border:0;outline:0;background:transparent;font-size:15px;padding:6px 0}
.qadd input.qt::placeholder{color:var(--muted)}
.qadd .fi{width:auto;height:30px}
.ring{width:21px;height:21px;border-radius:50%;border:1.5px solid var(--faint);flex-shrink:0;display:grid;place-items:center;transition:border-color .15s,background .15s}
.ring:hover{border-color:var(--accent)}
.ring.on{border-color:var(--rc,var(--accent))}
.ring.on::after{content:"";width:13px;height:13px;border-radius:50%;background:var(--rc,var(--accent))}
.ring.ghost{border-style:dashed;cursor:default}
.ring.ghost:hover{border-color:var(--faint)}
.tgroup{margin:18px 0 2px;display:flex;align-items:baseline;gap:8px}
.tgroup:first-child{margin-top:4px}
.tgroup h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.tgroup h3.red{color:var(--danger)}
.tgroup .n{color:var(--muted);font-size:13px}
.trow{display:flex;align-items:flex-start;gap:12px;padding:10px 6px 10px 6px;border-bottom:.5px solid var(--line);cursor:pointer;border-radius:0}
.trow:hover{background:var(--hover)}
.trow.open{background:var(--accent-soft)}
.trow .ring{margin-top:1px}
.tmain{flex:1;min-width:0}
.ttitle{font-size:14.5px;line-height:1.35;word-break:break-word}
.ttitle .pm{color:var(--accent);font-weight:700;margin-right:4px}
.trow.done .ttitle{color:var(--muted)}
.tmeta{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:3px;align-items:center}
.tmeta .od{color:var(--danger)}
.tmeta .td{color:var(--accent)}
.tmeta svg.i{width:12px;height:12px;vertical-align:-1px}
.tmeta .ln{display:inline-flex;align-items:center;gap:5px}
.tnote{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tflag{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--faint);opacity:0;flex-shrink:0}
.trow:hover .tflag,.tflag.on{opacity:1}
.tflag.on{color:var(--s-orange)}
.tflag.on svg.i{fill:currentColor}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-radius:12px;overflow:hidden;background:var(--line);gap:.5px;border:.5px solid var(--line)}
.cal .dow{background:var(--card);font-size:11.5px;font-weight:600;color:var(--muted);text-align:right;padding:8px 10px}
.cal .day{background:var(--card);min-height:104px;padding:6px 6px 8px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .day:hover{background:color-mix(in srgb,var(--card) 94%,var(--text))}
.cal .day.other{background:var(--card2)}
.cal .day.other .dn{color:var(--faint)}
.cal .dn{align-self:flex-end;font-size:12.5px;font-weight:500;width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.cal .today .dn{background:var(--danger);color:#fff;font-weight:600}
.cal .ev{display:block;width:100%;text-align:left;font-size:11.5px;padding:2px 6px;border-radius:5px;background:var(--tb);color:var(--ti);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.cal .ev.done{opacity:.5;text-decoration:line-through}
.cal .more{font-size:11px;color:var(--muted);padding-left:6px}
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.calhead h3{margin:0;font-size:22px;font-weight:700;letter-spacing:-.015em}
.calhead h3 span{color:var(--danger)}
.switch{width:44px;height:26px;border-radius:13px;background:var(--input);position:relative;transition:background .2s;flex-shrink:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s cubic-bezier(.32,.72,0,1)}
.switch.on{background:var(--ok)}
.switch.on::after{transform:translateX(18px)}
.tpeek-top{display:flex;gap:14px;align-items:flex-start}
.tpeek-top .ring{width:26px;height:26px;margin-top:5px}
.tpeek-top .ring.on::after{width:16px;height:16px}
.sublist{background:var(--card);border-radius:12px;padding:2px 14px}
.subrow{display:flex;align-items:center;gap:12px;border-bottom:.5px solid var(--line);min-height:42px}
.subrow:last-child{border-bottom:0}
.subrow input{flex:1;border:0;outline:0;background:transparent;padding:8px 0;min-width:0}
.subrow.done input{color:var(--muted);text-decoration:line-through}
.subrow .iconbtn{width:26px;height:26px;opacity:0}
.subrow:hover .iconbtn{opacity:1}
.listhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.listhead input.lname{font-size:34px;font-weight:700;letter-spacing:-.022em;border:0;outline:0;background:transparent;padding:0;min-width:0;width:auto;color:var(--ts)}
.swatches{display:flex;gap:6px}
.swatch{width:20px;height:20px;border-radius:50%;background:var(--ts)}
.swatch.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ts)}


/* MS-style planner */
.ptools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 0 18px}
.vtabs{display:flex;gap:6px;flex-wrap:wrap}
.vtab{height:32px;padding:0 13px;border-radius:980px;display:flex;align-items:center;gap:6px;font-weight:500;font-size:13px;background:var(--card);box-shadow:0 0 0 .5px var(--line2)}
.vtab svg.i{width:15px;height:15px;color:var(--muted)}
.vtab:hover{background:var(--hover)}
.vtab.on{box-shadow:0 0 0 1.5px var(--accent);color:var(--accent);font-weight:600}
.vtab.on svg.i{color:var(--accent)}
.vsep{width:1px;height:22px;background:var(--line2);margin:0 4px}
#pFilterBtn{display:flex;align-items:center;gap:6px}
.grpby{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.grpby select{border:0;background:transparent;font-weight:600;color:var(--text);cursor:pointer;outline:0}
.pboard{display:flex;gap:16px;overflow-x:auto;align-items:flex-start;padding:2px 2px 16px;min-height:62vh}
.pcol{flex:0 0 296px;min-width:0}
.pcol-h{display:flex;align-items:center;gap:4px;min-height:38px;padding:0 2px}
.pcol-h h3{font-size:17px;font-weight:700;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.bname{flex:1;min-width:0;font-size:17px;font-weight:700;letter-spacing:-.01em;border:0;background:transparent;outline:0;padding:4px 6px;margin-left:-6px;border-radius:7px;text-overflow:ellipsis}
.bname:hover{background:var(--hover)}
.bname:focus{background:var(--card);box-shadow:0 0 0 2px var(--accent)}
.pcol-h .iconbtn:hover{color:var(--text)}
.pcol-h .pop{top:34px}
.mi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 10px;border-radius:7px;font-size:13.5px;white-space:nowrap}
.mi:hover{background:var(--accent);color:#fff}
.mi.danger{color:var(--danger)}.mi.danger:hover{background:var(--danger);color:#fff}
.padd{display:flex;gap:8px;align-items:center;padding:8px 6px;font-weight:500;width:100%;border-radius:8px;margin-bottom:8px;color:var(--text)}
.padd svg.i{width:16px;height:16px;color:var(--accent)}
.padd:hover{background:var(--hover)}
.pcol-body{min-height:40px;border-radius:12px}
.pcol.over .pcol-body{outline:2px dashed var(--accent);outline-offset:4px}
.pcard{background:var(--card);border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 0 0 .5px var(--line2);padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:box-shadow .15s}
.pcard:hover{box-shadow:0 6px 18px rgba(0,0,0,.08),0 0 0 .5px var(--line2)}
.pcard.dragging{opacity:.4}
.pc-lbls{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.lbl{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:5px;font-size:12px;font-weight:600;background:var(--tb);color:var(--ti);white-space:nowrap}
.lbl.solid{background:var(--ts);color:#fff}
.lbl button{font-size:9px;opacity:.7;color:inherit}
.lbl button:hover{opacity:1}
.pc-t{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.38}
.pring{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--muted);flex-shrink:0;margin-top:1px;display:grid;place-items:center;color:transparent;transition:.15s}
.pring svg.i{width:11px;height:11px;stroke-width:3.2}
.pring:hover{color:var(--muted);border-color:var(--text)}
.pring.on{background:var(--ok);border-color:var(--ok);color:#fff}
.pring.ghost{border-style:dashed;border-color:var(--faint)}
.pring.big{width:24px;height:24px;margin-top:6px}
.pring.big svg.i{width:14px;height:14px}
.pcard.done .pc-t>span{text-decoration:line-through;color:var(--muted)}
.pc-f{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.pc-f .it{display:inline-flex;align-items:center;gap:4px}
.pc-f svg.i{width:14px;height:14px}
.pimp{color:var(--danger);font-weight:800;font-size:15px;line-height:1}
.dchip.late{color:#fff;background:var(--danger);padding:1px 6px;border-radius:5px}
.dchip.late svg.i{color:#fff}
.dchip.ok{color:var(--ok)}
.half{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--accent);background:linear-gradient(to top,var(--accent) 50%,transparent 50%);display:inline-block}
.avs{display:inline-flex;padding-left:6px}
.av{width:24px;height:24px;border-radius:50%;background:var(--ts);color:#fff;font-size:10px;font-weight:700;display:inline-grid;place-items:center;box-shadow:0 0 0 2px var(--card);margin-left:-6px;flex-shrink:0}
.donebar{display:flex;align-items:center;gap:6px;padding:8px 6px;color:var(--muted);font-weight:500;width:100%;border-radius:8px;font-size:13.5px}
.donebar:hover{background:var(--hover)}
.donebar svg.i{width:14px;height:14px}
.donebar .n{margin-left:auto}
.composer{background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:10px;box-shadow:0 0 0 2px var(--accent)}
.composer input#cmp-title{width:100%;border:0;outline:0;background:transparent;font-size:14px;padding:4px 0 10px}
.cmp-row{display:flex;gap:6px;align-items:center}
.cmp-row .fi{width:140px;height:30px}
.cmp-row .btn{height:30px;padding:0 12px}
.newbucket{padding-top:2px}
.sbar{display:grid;grid-template-columns:170px 1fr 34px;gap:12px;align-items:center;padding:7px 0;font-size:13.5px}
.sbar .sl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar .st{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--input)}
.sbar .st span{display:block;height:100%}
.sbar .r{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
/* task dialog */
.tmodal{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.32);display:none;align-items:center;justify-content:center;padding:28px}
.tmodal.on{display:flex}
.tm-box{background:var(--card);border-radius:16px;box-shadow:var(--shadow);width:min(1060px,100%);height:min(860px,100%);display:flex;flex-direction:column;overflow:hidden;animation:tmpop .24s cubic-bezier(.32,.72,0,1)}

.sp-table td{max-width:none;height:54px;vertical-align:middle}
.sp-sub{display:block;font-size:11.5px;color:var(--muted);font-weight:400;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-table .rv-over .sp-sub{color:var(--danger)}.sp-table .rv-soon .sp-sub{color:var(--warn)}
.sp-opt{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.sp-how{font-size:12.5px;color:var(--muted);margin:0 0 10px;line-height:1.5;max-width:110ch}
.sp-costs{min-width:980px}
.sp-evn{display:flex;align-items:center;gap:6px;white-space:normal;line-height:1.25}
.sp-evn svg.i{width:14px;height:14px;color:var(--muted);flex-shrink:0}
.sp-ev td .tag{margin:2px 4px 2px 0}
.sp-ev td{white-space:normal}
tr.sp-sub-row td{height:38px;background:var(--card2);font-size:13px}
tr.sp-sub-row td.name{padding-left:34px;font-weight:400}
.sp-warn{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--warn) 12%,var(--card));margin:0 0 18px;font-size:13.5px;line-height:1.45}
.sp-warn svg.i{color:var(--warn);margin-top:1px}
.sp-block{margin-top:22px}
.sp-block .panel-h h2{font-size:18px}
.sp-dept{max-width:720px}
.sp-dept .hbar{grid-template-columns:170px 1fr 100px}
.sp-costs{min-width:1000px}
tr.sp-sub-row td{white-space:normal;line-height:1.3}
@media (max-width:1100px){.s8,.s4,.s6,.s7,.s5{grid-column:span 12}.deptgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .side{position:fixed;top:0;bottom:0;left:0;z-index:30;transform:translateX(-100%);transition:transform .25s cubic-bezier(.32,.72,0,1);box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 92%,transparent)}
  .side.on{transform:none}
  #menuBtn{display:grid;place-items:center;width:34px;height:34px;border-radius:8px}
  .topbar{padding:0 12px;gap:8px}
  .me div,.theme button span{display:none}.me{padding-left:4px}
  .page{padding:16px 14px 80px}
  h1,.listhead input.lname{font-size:28px}
  .panel{padding:14px}
  .peek{top:0;right:0;bottom:0;width:100%;border-radius:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .peek-body{padding:18px 14px 80px}
  .props{grid-template-columns:118px 1fr}
  .idgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fgrid,.deptgrid{grid-template-columns:1fr}
  .search{min-width:0;flex:1}
  .hbar{grid-template-columns:110px 1fr 32px}
  .cal .day{min-height:70px;padding:4px}
  .cal .ev{font-size:10px;padding:1px 4px}
  .tflag{opacity:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(function(){
"use strict";
/* ================= reference lists ================= */
const CATS=[{n:"Legal",c:"purple",g:"dept"},{n:"Community Services",c:"green",g:"dept"},{n:"All departments",c:"teal",g:"dept"},{n:"Branding",c:"pink",g:"mkt"},{n:"Marketing Material",c:"blue",g:"mkt"},{n:"Flyer",c:"orange",g:"mkt"},{n:"Brochure",c:"yellow",g:"mkt"}];
const CGROUPS=[{g:"dept",l:"Departments"},{g:"mkt",l:"Marketing material"}];
const catGroupsOf=list=>CGROUPS.map(x=>({l:x.l,cats:list.filter(c=>c.g===x.g)})).concat([{l:"Other",cats:list.filter(c=>!CGROUPS.some(x=>x.g===c.g))}]).filter(x=>x.cats.length);
const catOptGroups=(list,sel)=>catGroupsOf(list).map(x=>`<optgroup label="${esc(x.l)}">${x.cats.map(c=>`<option ${sel===c.n?"selected":""}>${esc(c.n)}</option>`).join("")}</optgroup>`).join("");
const TYPES=["Policy","Procedure","Form","Template","Guideline","Strategy","Report","Factsheet","Design file","Other"];
const STATUSES=[{n:"Draft",c:"gray"},{n:"In review",c:"yellow"},{n:"Approved",c:"blue"},{n:"Published",c:"green"},{n:"Superseded",c:"orange"},{n:"Archived",c:"brown"}];
const CLASSES=[{n:"Public",c:"green"},{n:"Internal",c:"gray"},{n:"Confidential",c:"red"}];
const CYCLES=[[0,"No set cycle"],[6,"Every 6 months"],[12,"Every year"],[24,"Every 2 years"],[36,"Every 3 years"]];
const INACTIVE=["Superseded","Archived"];
const SCATS=[{n:"Flyer",c:"orange"},{n:"Brochure",c:"yellow"},{n:"Branding",c:"pink"},{n:"Marketing Material",c:"blue"},{n:"Merchandise",c:"purple"},{n:"Banner & signage",c:"red"},{n:"Stationery",c:"green"},{n:"Other",c:"gray"}];
const DEPTS=[{n:"Legal",c:"purple"},{n:"Community Services",c:"green"},{n:"Corporate Services",c:"blue"},{n:"All staff",c:"teal"}];
const MOVE={Opening:{l:"Opening stock",c:"gray"},Received:{l:"Received",c:"green"},Issued:{l:"Issued",c:"orange"},Returned:{l:"Returned",c:"blue"},Adjustment:{l:"Adjustment",c:"yellow"},Count:{l:"Stock take",c:"purple"},Reversal:{l:"Reversal",c:"red"}};
const catOf=n=>CATS.find(c=>c.n===n)||{n:n||"",c:"gray"};
const scatOf=n=>SCATS.find(c=>c.n===n)||{n:n||"",c:"gray"};
const deptOf=n=>DEPTS.find(c=>c.n===n)||{n:n||"",c:"gray"};
const statusOf=n=>STATUSES.find(s=>s.n===n)||STATUSES[0];
const classOf=n=>CLASSES.find(s=>s.n===n)||CLASSES[1];
const DAY=864e5;

/* ================= icons ================= */
const IC={"home": "<rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"/>", "doc": "<path d=\"M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z\"/><path d=\"M14 3v5h5M9 13h6M9 17h6\"/>", "box": "<path d=\"M21 8l-9-5-9 5 9 5 9-5z\"/><path d=\"M3 8v8l9 5 9-5V8M12 13v8\"/>", "clock": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/>", "chart": "<path d=\"M3 3v18h18\"/><path d=\"M7 15l4-4 3 3 5-6\"/>", "alert": "<path d=\"M12 3l9.5 17h-19z\"/><path d=\"M12 10v4M12 17.5v.01\"/>", "plus": "<path d=\"M12 5v14M5 12h14\"/>", "arrow": "<path d=\"M4 12h14M13 6l6 6-6 6\"/>", "search": "<circle cx=\"11\" cy=\"11\" r=\"7\"/><path d=\"M20 20l-3.5-3.5\"/>", "sun": "<circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4\"/>", "moon": "<path d=\"M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z\"/>", "auto": "<rect x=\"3\" y=\"4\" width=\"18\" height=\"13\" rx=\"2\"/><path d=\"M8 21h8M12 17v4\"/>", "menu": "<path d=\"M4 6h16M4 12h16M4 18h16\"/>", "users": "<circle cx=\"9\" cy=\"8\" r=\"4\"/><path d=\"M2 21a7 7 0 0 1 14 0\"/><path d=\"M16 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3\"/>", "cal": "<rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"3\"/><path d=\"M3 10h18M8 3v4M16 3v4\"/>", "tray": "<path d=\"M3 13l3-8h12l3 8v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z\"/><path d=\"M3 13h5l1 3h6l1-3h5\"/>", "flag": "<path d=\"M5 21V4M5 4h12l-2.5 4.5L17 13H5\"/>", "check": "<path d=\"M5 12.5l4.5 4.5L19 7.5\"/>", "tasks": "<path d=\"M10 6h10M10 12h10M10 18h10\"/><path d=\"M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5\"/>", "board": "<rect x=\"3\" y=\"4\" width=\"5\" height=\"16\" rx=\"1.5\"/><rect x=\"10\" y=\"4\" width=\"5\" height=\"11\" rx=\"1.5\"/><rect x=\"17\" y=\"4\" width=\"4\" height=\"7\" rx=\"1.5\"/>", "repeat": "<path d=\"M17 2l3 3-3 3\"/><path d=\"M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3\"/><path d=\"M20 13v2a4 4 0 0 1-4 4H4\"/>", "chevL": "<path d=\"M15 6l-6 6 6 6\"/>", "chevR": "<path d=\"M9 6l6 6-6 6\"/>", "list": "<path d=\"M9 6h11M9 12h11M9 18h11\"/><circle cx=\"4.5\" cy=\"6\" r=\"1\" fill=\"currentColor\"/><circle cx=\"4.5\" cy=\"12\" r=\"1\" fill=\"currentColor\"/><circle cx=\"4.5\" cy=\"18\" r=\"1\" fill=\"currentColor\"/>", "bell": "<path d=\"M6 16V11a6 6 0 0 1 12 0v5l2 2H4z\"/><path d=\"M10 20a2 2 0 0 0 4 0\"/>", "down": "<path d=\"M12 5v14M6 13l6 6 6-6\"/>", "checklist": "<rect x=\"4\" y=\"4\" width=\"16\" height=\"16\" rx=\"3\"/><path d=\"M8 12l2.5 2.5L16 9\"/>", "note": "<path d=\"M5 4h14v16H5z\"/><path d=\"M8 9h8M8 13h8M8 17h5\"/>", "chat": "<path d=\"M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z\"/>", "clip": "<path d=\"M21 11l-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7\"/>", "more": "<circle cx=\"5\" cy=\"12\" r=\"1.3\" fill=\"currentColor\"/><circle cx=\"12\" cy=\"12\" r=\"1.3\" fill=\"currentColor\"/><circle cx=\"19\" cy=\"12\" r=\"1.3\" fill=\"currentColor\"/>", "chevD": "<path d=\"M6 9l6 6 6-6\"/>", "filter": "<path d=\"M4 6h16M7 12h10M10 18h4\"/>", "tag": "<path d=\"M3 12V4h8l10 10-8 8z\"/><circle cx=\"7.5\" cy=\"8.5\" r=\"1.3\"/>", "copy": "<rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2\"/><path d=\"M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3\"/>", "trash": "<path d=\"M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13\"/>", "x": "<path d=\"M6 6l12 12M18 6L6 18\"/>", "send": "<path d=\"M4 12l16-8-6 16-2-6z\"/>", "bag": "<path d=\"M6 8h12l-1 12H7z\"/><path d=\"M9 8V6a3 3 0 0 1 6 0v2\"/>", "print": "<path d=\"M6 9V3h12v6\"/><rect x=\"3\" y=\"9\" width=\"18\" height=\"8\" rx=\"2\"/><path d=\"M6 14h12v7H6z\"/>", "shield": "<path d=\"M12 3l8 3v6c0 4.6-3.4 8.4-8 9-4.6-.6-8-4.4-8-9V6z\"/><path d=\"M9 12l2 2 4-4\"/>", "upload": "<path d=\"M12 15V4M7 9l5-5 5 5\"/><path d=\"M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4\"/>", "download": "<path d=\"M12 4v11M7 10l5 5 5-5\"/><path d=\"M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4\"/>"};
const svg=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;
/* ================= utils ================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isoOf=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const todayISO=()=>isoOf(new Date());
const addMonths=(iso,m)=>{const d=new Date(iso+"T00:00:00");d.setMonth(d.getMonth()+m);return isoOf(d)};
const daysUntil=iso=>{const t=new Date(iso+"T00:00:00"),n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/DAY)};
const fmtDate=ts=>ts?new Date(ts).toLocaleDateString("en-AU",{day:"numeric",month:"short",year:"numeric"}):"";
const fmtISO=iso=>iso?new Date(iso+"T00:00:00").toLocaleDateString("en-AU",{day:"numeric",month:"short",year:"numeric"}):"";
const relTime=ts=>{if(!ts)return"";const s=(Date.now()-ts)/1000;if(s<60)return"just now";if(s<3600)return Math.floor(s/60)+" min ago";if(s<86400)return Math.floor(s/3600)+" h ago";if(s<7*86400)return Math.floor(s/86400)+" d ago";return fmtDate(ts)};
const parseV=v=>{const m=/^(\d+)(?:\.(\d+))?/.exec(String(v||"").trim());return m?[+m[1],+(m[2]||0)]:[1,0]};
const bump=(v,k)=>{const[a,b]=parseV(v);return k==="Major"?(a+1)+".0":a+"."+(b+1)};
const cmpV=(x,y)=>{const a=parseV(x),b=parseV(y);return a[0]-b[0]||a[1]-b[1]};
const num=v=>{const n=parseInt(v,10);return isFinite(n)?n:0};
const fmtN=n=>Number(n||0).toLocaleString("en-AU");
const isActive=d=>!INACTIVE.includes(d.status);
const reviewState=d=>{if(!isActive(d)||!d.reviewDate)return null;const k=daysUntil(d.reviewDate);return k<0?"over":k<=30?"soon":null};
const dash='<span class="faint">—</span>';

const wq=[];let wActive=0;
function wlimit(fn){return new Promise((res,rej)=>{wq.push({fn,res,rej});wpump()})}
function wpump(){while(wActive<4&&wq.length){const j=wq.shift();wActive++;const run=n=>Promise.resolve().then(j.fn).then(v=>{wActive--;j.res(v);wpump()},err=>{if(err&&(err.code==="resource_exhausted"||err.code==="unavailable")&&n<4)setTimeout(()=>run(n+1),900*(n+1)+Math.random()*400);else{wActive--;j.rej(err);wpump()}});run(0)}}
function loadLocal(s){try{const v=JSON.parse(localStorage.getItem(STORES[s].ls)||"[]");return Array.isArray(v)?v.map(STORES[s].norm):[]}catch(e){return[]}}

const get=(s,id)=>DB[s].find(x=>x.id===id);
function write(s,r){
  mirror(s);const c=cols[s];if(!c)return Promise.resolve();
  const key=s+":"+r.id,body=JSON.parse(JSON.stringify(r));
  chn[key]=(chn[key]||Promise.resolve()).then(()=>wlimit(()=>c.doc(r.id).set(body))).catch(err=>{
    if(err&&err.code==="unavailable")return new Promise(z=>setTimeout(z,800+Math.random()*800)).then(()=>c.doc(r.id).set(body)).catch(()=>toast("Couldn't sync. Changes are kept in this browser."));
    toast(err&&err.code==="quota_exceeded"?"Storage is full. Remove old records to add more.":"Couldn't sync. Changes are kept in this browser.");
  });
  return chn[key];
}
function addRec(s,r){DB[s].push(r);const k=s+":"+r.id;padd.add(k);write(s,r).then(()=>padd.delete(k));return r}
function setF(s,id,patch,delay){
  const r=get(s,id);if(!r)return;Object.assign(r,patch);
  const key=s+":"+id;pend[key]=Object.assign({},pend[key],patch);clearTimeout(tmr[key]);
  const go=()=>{r.updated=Date.now();const snap=pend[key];write(s,r).then(()=>{if(pend[key]===snap)delete pend[key]})};
  if(delay)tmr[key]=setTimeout(()=>{go();renderSide();renderMain()},delay);else go();
}
function delRec(s,id){DB[s]=DB[s].filter(x=>x.id!==id);mirror(s);if(cols[s])wlimit(()=>cols[s].doc(id).delete()).catch(()=>toast("Couldn't delete from your account. Try again."))}

async function connect(){
  if(!window.claude||typeof window.claude.use!=="function")return;
  try{
    const[db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;const uid=await user.id();if(!uid)return;
    const root=db.doc("data/users/"+uid+"/register");
    await Promise.all(Object.keys(STORES).map(async s=>{
      const c=root.collection(STORES[s].coll);const first=await c.get();
      if(first.empty&&DB[s].length){for(const r of DB[s])await wlimit(()=>c.doc(r.id).set(JSON.parse(JSON.stringify(r))))}
      cols[s]=c;
      c.onSnapshot(snap=>{
        const prev=DB[s];DB[s]=snap.docs.map(x=>{const r=STORES[s].norm(JSON.parse(JSON.stringify(x.data())));const p=pend[s+":"+r.id];return p?Object.assign(r,p):r});
        if(padd.size)prev.forEach(r=>{if(padd.has(s+":"+r.id)&&!DB[s].some(x=>x.id===r.id))DB[s].push(r)});
        mirror(s);snapRender();
      },()=>{});
    }));
    setSync(true);
  }catch(e){setSync(false)}
}

function autoTotal(o){const u=parseFloat(o.unitCost),su=parseFloat(o.setupCost),fr=parseFloat(o.freight);if(isNaN(u)&&isNaN(su)&&isNaN(fr))return null;return(isNaN(u)?0:u*num(o.qty))+(isNaN(su)?0:su)+(isNaN(fr)?0:fr)}

function resolvePerson(a){
  if(a.personId==="__new"){
    const name=(a.newName||"").trim(),dept=a.newDept||"";
    if(!name)return{err:"Enter the person's name."};
    if(!dept)return{err:"Choose their department."};
    const ex=DB.people.find(p=>p.name.trim().toLowerCase()===name.toLowerCase()&&p.department===dept);
    if(ex)return{p:ex};

function filteredDocs(){
  const nav=NAVS.find(n=>n.id===ui.nav)||NAVS[0];const q=ui.q.trim().toLowerCase();
  let list=DB.docs.filter(nav.f);
  if(ui.cat)list=list.filter(d=>d.category===ui.cat);
  if(ui.type)list=list.filter(d=>d.type===ui.type);
  if(ui.status&&ui.view==="table")list=list.filter(d=>d.status===ui.status);
  if(q)list=list.filter(d=>[d.title,d.ref,d.prevRef,d.owner,d.approver,d.category,d.keywords,d.notes,d.type,d.version].join(" ").toLowerCase().includes(q));
  const{k,d:dir}=ui.sort;
  list.sort((a,b)=>{let r;
    if(k==="version"||k==="prevVersion")r=cmpV(a[k],b[k]);
    else if(k==="updated")r=(a.updated||0)-(b.updated||0);
    else if(k==="reviewDate"||k==="effectiveDate"){const x=a[k]||"9999",y=b[k]||"9999";r=x<y?-1:x>y?1:0}
    else if(k==="status")r=STATUSES.findIndex(s=>s.n===a.status)-STATUSES.findIndex(s=>s.n===b.status);
    else r=String(a[k]||"").localeCompare(String(b[k]||""),undefined,{numeric:true});
    return r*dir});
  return list;
}

const DCOL={"Legal":"var(--s-purple)","Community Services":"var(--s-green)","Corporate Services":"var(--s-blue)","All staff":"var(--s-teal)"};
function monthKey(offset){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-offset);return isoOf(d).slice(0,7)}
function scard(o){return`<${o.goto?"button":"div"} class="scard" ${o.goto?`data-goto="${o.goto}"`:""}><div class="scard-top"><div class="tile" data-c="${o.c}">${svg(o.i)}</div><div class="v ${o.alert?"alert":""}">${o.v}</div></div><div class="l">${esc(o.l)}</div><div class="f">${o.f||"&nbsp;"}</div></${o.goto?"button":"div"}>`}
function trend(cur,prev){if(!prev&&!cur)return'<span class="muted">No movement last month</span>';if(!prev)return'<span class="up">New</span> <span>vs nothing last month</span>';const p=Math.round((cur-prev)/prev*100);return`<span class="${p>=0?"up":"down"}">${p>=0?"▲":"▼"} ${Math.abs(p)}%</span><span>vs last month</span>`}
function takenBetween(fromKey,toKey){return DB.moves.filter(counts).filter(m=>{const k=(m.eventDate||m.date||"").slice(0,7);return k>=fromKey&&k<=toKey})}
function niceMax(v){if(v<=1)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return(n<=1?1:n<=2?2:n<=5?5:10)*p}
function barChart(){
  const keys=[5,4,3,2,1,0].map(monthKey);const depts=DEPTS.map(d=>d.n);
  const data=keys.map(k=>{const r={k,t:0};depts.concat(["Other"]).forEach(d=>r[d]=0);takenBetween(k,k).forEach(m=>{const d=depts.includes(m.department)?m.department:"Other";const v=takenOf(m);r[d]+=v;r.t+=v});return r});
  if(!data.some(r=>r.t))return'<div class="nodata">Nothing has been issued in the last six months.</div>';
  const W=640,H=250,L=40,B=30,T=12,pw=W-L-10,ph=H-B-T,max=niceMax(Math.max(...data.map(r=>r.t))/4)*4;
  let g="";for(let i=0;i<=4;i++){const y=T+ph-ph*i/4;g+=`<line class="gl" x1="${L}" x2="${W-6}" y1="${y}" y2="${y}"/><text x="${L-8}" y="${y+4}" text-anchor="end">${fmtN(max*i/4)}</text>`}
  const slot=pw/data.length,bw=Math.min(38,slot*.45);
  data.forEach((r,i)=>{const x=L+slot*i+(slot-bw)/2;let y=T+ph;
    depts.concat(["Other"]).forEach(d=>{if(!r[d]||r[d]<0)return;const h=ph*r[d]/max;y-=h;g+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h,0)}" rx="4" fill="${DCOL[d]||"var(--faint)"}"><title>${esc(d)}: ${fmtN(r[d])}</title></rect>`});
    const lab=new Date(r.k+"-01T00:00:00").toLocaleDateString("en-AU",{month:"short"});
    g+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${lab}</text>`;
    if(r.t)g+=`<text x="${x+bw/2}" y="${y-6}" text-anchor="middle" style="fill:var(--text);font-weight:700">${fmtN(r.t)}</text>`});
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Stock taken per month by department">${g}</svg>`;
}
function donut(){
  const since=isoOf(new Date(Date.now()-90*DAY));const tot={};let all=0;
  DB.moves.filter(counts).filter(m=>(m.eventDate||m.date||"")>=since).forEach(m=>{const d=DEPTS.some(x=>x.n===m.department)?m.department:"Other";const v=takenOf(m);tot[d]=(tot[d]||0)+v;all+=v});
  if(all<=0)return'<div class="nodata">No stock taken in the last 90 days.</div>';
  const R=70,C=2*Math.PI*R;let off=0,segs="";
  const rows=DEPTS.map(d=>d.n).concat(["Other"]).filter(d=>tot[d]>0);
  rows.forEach(d=>{const len=C*tot[d]/all;segs+=`<circle cx="100" cy="100" r="${R}" fill="none" stroke="${DCOL[d]||"var(--faint)"}" stroke-width="26" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"><title>${esc(d)}: ${fmtN(tot[d])}</title></circle>`;off+=len});
  return`<div class="donutwrap"><svg class="chart" viewBox="0 0 200 200" style="max-width:200px" role="img" aria-label="Share of stock taken by department"><circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--bg)" stroke-width="26"/>${segs}<text x="100" y="100" text-anchor="middle" class="donut-c">${fmtN(all)}</text><text x="100" y="120" text-anchor="middle">units</text></svg>
  <ul class="dlist">${rows.map(d=>`<li><span class="cdot" style="background:${DCOL[d]||"var(--faint)"}"></span>${esc(d)}<span class="r">${fmtN(tot[d])} <span class="faint" style="font-weight:500">· ${Math.round(tot[d]/all*100)}%</span></span></li>`).join("")}</ul></div>`;
}

function renderStockFilters(){

  if(["inventory","low","count","reorder"].includes(v))h+=`<select class="ctl ${st.cat?"set":""}" data-sf="cat" aria-label="Category">${opt(SCATS,st.cat,"Category")}</select>`;
  if(v==="activity"){
    h+=`<select class="ctl ${st.kind?"set":""}" data-sf="kind" aria-label="Movement">${opt(Object.keys(MOVE).map(k=>({n:k,l:MOVE[k].l})),st.kind,"Movement")}</select>`;
    h+=`<select class="ctl ${st.person?"set":""}" data-sf="person" aria-label="Person">${opt(DB.people.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>({n:p.id,l:p.name})),st.person,"Person")}</select>`;
    h+=`<select class="ctl ${st.event?"set":""}" data-sf="event" aria-label="Event">${opt(eventNames(),st.event,"Event")}</select>`;
    h+=`<input type="date" class="ctl ${st.from?"set":""}" data-sf="from" value="${esc(st.from)}" aria-label="From date" title="From">`;
    h+=`<input type="date" class="ctl ${st.to?"set":""}" data-sf="to" value="${esc(st.to)}" aria-label="To date" title="To">`;
  }
  if(v==="orders"||v==="merch")h+=`<select class="ctl ${st.ostatus?"set":""}" data-sf="ostatus" aria-label="Order status">${opt(PSTAT.filter(x=>x.n==="Part delivered"||x.n==="Cancelled"||OT[v==="merch"?"merch":"print"].flow.includes(x.n)),st.ostatus,"Status")}</select>`;
  if(v==="costs"){h+=`<input type="date" class="ctl ${st.from?"set":""}" data-sf="from" value="${esc(st.from)}" aria-label="From date" title="From">`;h+=`<input type="date" class="ctl ${st.to?"set":""}" data-sf="to" value="${esc(st.to)}" aria-label="To date" title="To">`}
  if(["activity","events","people","costs"].includes(v))h+=`<select class="ctl ${st.dept?"set":""}" data-sf="dept" aria-label="Department">${opt(DEPTS,st.dept,"Department")}</select>`;
  $("sFilters").innerHTML=h;
  const c=[];
  if(st.cat&&["inventory","low","count","reorder"].includes(v))c.push(chip("Category: "+st.cat,"cat","stock"));
  if(v==="activity"){if(st.kind)c.push(chip("Movement: "+MOVE[st.kind].l,"kind","stock"));if(st.person){const p=get("people",st.person);c.push(chip("Person: "+(p?p.name:"?"),"person","stock"))}if(st.event)c.push(chip("Event: "+st.event,"event","stock"));if(st.from)c.push(chip("From "+fmtISO(st.from),"from","stock"));if(st.to)c.push(chip("To "+fmtISO(st.to),"to","stock"))}
  if(st.ostatus&&(v==="orders"||v==="merch"))c.push(chip("Status: "+st.ostatus,"ostatus","stock"));
  if(st.dept&&["activity","events","people"].includes(v))c.push(chip("Department: "+st.dept,"dept","stock"));
  if(st.q)c.push(chip("“"+st.q+"”","q","stock"));
  $("sChips").innerHTML=c.join("");
}
const SCOLS=[["code","Code"],["name","Item"],["category","Category"],["oh","On hand"],["onorder","On order"],["reorderLevel","Reorder at"],["location","Location"],["out30","Taken (30 days)"],["last","Last movement"]];
function renderInventory(lowOnly){
  const st=ui.stock,sm=stockMap(),q=st.q.trim().toLowerCase();
  const since=isoOf(new Date(Date.now()-30*DAY));const out30={},last={};
  DB.moves.forEach(m=>{if(counts(m)&&(m.eventDate||m.date)>=since)out30[m.itemId]=(out30[m.itemId]||0)+takenOf(m);if(!last[m.itemId]||m.created>last[m.itemId])last[m.itemId]=m.created});
  if(!DB.items.length)return`<div class="empty"><p class="big">No stock items yet</p><p>Add the flyers, brochures and merchandise you hold, then record what goes out for each event.</p><button class="btn btn-primary" data-newitem>New item</button></div>`;
  let list=DB.items.filter(i=>st.arch||!i.archived);
  if(st.cat)list=list.filter(i=>i.category===st.cat);
  if(q)list=list.filter(i=>[i.name,i.code,i.location,i.supplier,i.category,i.notes].join(" ").toLowerCase().includes(q));
  if(lowOnly)list=list.filter(i=>!i.archived&&isLow(i,sm[i.id]||0));
  const oo=onOrderMap();const val=i=>({onorder:oo[i.id]||0,oh:sm[i.id]||0,out30:out30[i.id]||0,last:last[i.id]||0,reorderLevel:num(i.reorderLevel)})[st.sort.k];
  list.sort((a,b)=>{const x=val(a),y=val(b);const r=x!==undefined?x-y:String(a[st.sort.k]||"").localeCompare(String(b[st.sort.k]||""),undefined,{numeric:true});return r*st.sort.d});
  if(!list.length)return lowOnly&&!q&&!st.cat?`<div class="empty"><p class="big">Nothing is running low</p><p>Set a reorder level on each item and it'll show up here when stock drops to it.</p></div>`:`<div class="empty"><p class="big">Nothing matches</p><p>Try clearing the filters.</p><button class="link" data-sclearall>Clear filters</button></div>`;
  const archCount=DB.items.filter(i=>i.archived).length;
  return`<div class="tablewrap"><table><thead><tr>${SCOLS.map(([k,l])=>`<th><button data-ssort="${k}">${l}${st.sort.k===k?`<span class="arrow">${st.sort.d>0?"▲":"▼"}</span>`:""}</button></th>`).join("")}</tr></thead><tbody>
  ${list.map(i=>{const oh=sm[i.id]||0,lo=isLow(i,oh);return`<tr data-item="${i.id}" tabindex="0" class="${ui.peek&&ui.peek.id===i.id?"open":""}">
    <td class="muted">${esc(i.code)||dash}</td>
    <td class="name">${i.name?esc(i.name):'<span class="faint">Untitled item</span>'}${i.archived?' <span class="faint" style="font-weight:400">(archived)</span>':""}</td>
    <td>${scatTag(i.category)}</td>
    <td><span class="oh" style="${lo?"color:var(--danger)":""}">${fmtN(oh)}</span> <span class="faint">${esc(i.unit)}</span>${oh<=0?'<span class="due over">Out of stock</span>':lo?'<span class="due over">Low</span>':""}</td>
    <td>${oo[i.id]?`<span class="oh" style="color:var(--accent)">${fmtN(oo[i.id])}</span>`:dash}</td>
    <td class="muted">${num(i.reorderLevel)?fmtN(i.reorderLevel):dash}</td>
    <td class="muted">${esc(i.location)||dash}</td>
    <td>${out30[i.id]?fmtN(out30[i.id]):dash}</td>
    <td class="muted">${last[i.id]?esc(relTime(last[i.id])):dash}</td></tr>`}).join("")}</tbody></table></div>
  <button class="addrow" data-newitem>＋ New item</button>
  <div style="display:flex;align-items:center"><div class="count">${list.length} ${list.length===1?"item":"items"}</div><span class="spacer"></span>${archCount?`<button class="togglelink" data-togglearch>${st.arch?"Hide":"Show"} archived (${archCount})</button>`:""}</div>`;
}

    :`<div class="empty"><p class="big">No print orders yet</p><p>Record each print job: what you're printing, how many, which printer, and when it's due. Deliveries go straight into stock.</p><button class="btn btn-primary" data-neworder data-otype="print">New print order</button></div>`;

    <td>${ordTag(o.status)}</td>

    <td class="muted">${esc(o.supplier)||dash}</td>
    <td class="muted">${o.orderDate?esc(fmtISO(o.orderDate)):dash}</td>
    <td>${o.due?esc(fmtISO(o.due)):dash}${ordLate(o)?'<span class="due over">Overdue</span>':""}</td>
    <td class="muted">${tot!=null?esc(money(tot)):dash}</td></tr>`}).join("")}</tbody></table></div>
  <button class="addrow" data-neworder data-otype="${type}">＋ New ${M?"merch":"print"} order</button>
  <div class="count">${l.length} ${l.length===1?"order":"orders"} · ${op.length} open · ${fmtN(units)} units still to arrive${spend?` · ${esc(money(spend))} total`:""}</div>`;

function filteredMoves(){
  const st=ui.stock,q=st.q.trim().toLowerCase();
  let l=DB.moves.slice();
  if(st.kind)l=l.filter(m=>m.kind===st.kind);
  if(st.dept)l=l.filter(m=>m.department===st.dept);
  if(st.person)l=l.filter(m=>m.personId===st.person);
  if(st.event)l=l.filter(m=>(m.event||"").trim()===st.event);
  if(st.from)l=l.filter(m=>(m.date||"")>=st.from);
  if(st.to)l=l.filter(m=>(m.date||"")<=st.to);
  if(q)l=l.filter(m=>[itemName(m.itemId),m.personName,m.department,m.event,m.note,m.by].join(" ").toLowerCase().includes(q));
  return l.sort((a,b)=>(b.date||"").localeCompare(a.date||"")||b.created-a.created);
}
function renderActivity(){
  const l=filteredMoves();
  if(!DB.moves.length)return`<div class="empty"><p class="big">No stock movements yet</p><p>Issues, returns, deliveries and stock takes will be listed here.</p></div>`;
  if(!l.length)return`<div class="empty"><p class="big">Nothing matches</p><p>Try clearing the filters.</p><button class="link" data-sclearall>Clear filters</button></div>`;
  const sum=k=>l.filter(m=>m.kind===k&&!m.reversed).reduce((a,m)=>a+Math.abs(num(m.qty)),0);
  return`<div class="tablewrap"><table><thead><tr><th><button>Date</button></th><th><button>Item</button></th><th><button>Movement</button></th><th><button>Qty</button></th><th><button>Taken by</button></th><th><button>Department</button></th><th><button>Event</button></th><th><button>Note</button></th><th><button>Recorded by</button></th><th></th></tr></thead><tbody>
  ${l.map(m=>`<tr class="${m.reversed?"rev":""}" data-item="${m.itemId}">
    <td>${esc(fmtISO(m.date))}</td><td class="name">${esc(itemName(m.itemId))}</td><td>${moveTag(m.kind)}${m.reversed?' <span class="faint">reversed</span>':""}</td><td>${signed(num(m.qty))}</td>
    <td>${esc(m.personName)||dash}</td><td>${m.department?deptTag(m.department):dash}</td>

  </tbody></table></div>
  <div class="count">${l.length} movements · Issued ${fmtN(sum("Issued"))} · Returned ${fmtN(sum("Returned"))} · Received ${fmtN(sum("Received")+sum("Opening"))}</div>`;

function eventGroups(){
  const st=ui.stock,q=st.q.trim().toLowerCase(),g={};
  DB.moves.filter(counts).forEach(m=>{
    if(st.dept&&m.department!==st.dept)return;
    const name=(m.event||"").trim()||"No event recorded",key=name.toLowerCase();
    const e=g[key]||(g[key]={name,dates:new Set(),items:{},people:{},total:0,last:""});
    const t=takenOf(m);e.total+=t;
    const d=m.eventDate||m.date||"";if(d){e.dates.add(d);if(d>e.last)e.last=d}
    const it=e.items[m.itemId]||(e.items[m.itemId]={issued:0,returned:0});
    if(m.kind==="Issued")it.issued+=Math.abs(num(m.qty));else it.returned+=Math.abs(num(m.qty));
    const pk=m.personId||m.personName||"?";const p=e.people[pk]||(e.people[pk]={name:m.personName||"Unknown",dept:m.department,qty:0});p.qty+=t;
  });
  let list=Object.values(g);
  if(q)list=list.filter(e=>(e.name+" "+Object.values(e.people).map(p=>p.name).join(" ")).toLowerCase().includes(q));
  return list.sort((a,b)=>(b.last||"").localeCompare(a.last||""));
}
function renderEvents(){
  const list=eventGroups(),spC={};spEventCosts().forEach(x=>spC[x.name]=x);
  if(!list.length)return`<div class="empty"><p class="big">No events yet</p><p>Use “Issue for an event” to record what each event takes.</p><button class="btn btn-primary" data-issue>Issue for an event</button></div>`;
  return list.map(e=>{const ds=[...e.dates].sort();const when=ds.length?(ds.length>1&&ds[0]!==ds[ds.length-1]?fmtISO(ds[0])+" – "+fmtISO(ds[ds.length-1]):fmtISO(ds[0])):"";
    return`<section class="evcard"><div class="evhead"><h3>${esc(e.name)}</h3><span class="muted">${esc(when)}</span><span class="spacer"></span><span><span class="oh">${fmtN(e.total)}</span> <span class="muted">units taken</span></span>${spC[e.name]&&spC[e.name].cost?`<span class="tag" data-c="blue" title="Cost of stock used">${money(spC[e.name].cost)}</span>`:""}${e.name!=="No event recorded"?`<button class="ctl" data-evact="${esc(e.name)}">Activity</button>`:""}</div>

    <table class="mini"><thead><tr><th><button>Item</button></th><th><button>Issued</button></th><th><button>Returned</button></th><th><button>Used</button></th></tr></thead><tbody>

    </tbody></table></section>`}).join("");
}
function renderPeople(){
  const st=ui.stock,q=st.q.trim().toLowerCase();
  const stats={};DB.moves.filter(counts).forEach(m=>{const s=stats[m.personId]||(stats[m.personId]={qty:0,events:new Set(),last:""});s.qty+=takenOf(m);if(m.event)s.events.add(m.event.trim().toLowerCase());const d=m.eventDate||m.date;if(d>s.last)s.last=d});
  const deptTot={};DB.moves.filter(counts).forEach(m=>{deptTot[m.department]=(deptTot[m.department]||0)+takenOf(m)});
  let list=DB.people.slice().sort((a,b)=>(a.active===false)-(b.active===false)||a.name.localeCompare(b.name));
  if(st.dept)list=list.filter(p=>p.department===st.dept);
  if(q)list=list.filter(p=>(p.name+" "+p.department).toLowerCase().includes(q));
  const used=id=>DB.moves.some(m=>m.personId===id);
  return`<div class="addperson"><input class="fi" id="np-name" placeholder="Full name" aria-label="New person's name"><select class="fi" id="np-dept" aria-label="Department">${opt(DEPTS,"","Choose department")}</select><button class="btn btn-primary" id="np-add">Add person</button></div>

  ${list.length?`<div class="tablewrap"><table><thead><tr><th><button>Name</button></th><th><button>Department</button></th><th><button>Units taken</button></th><th><button>Events</button></th><th><button>Last collected</button></th><th></th></tr></thead><tbody>
  ${list.map(p=>{const s=stats[p.id]||{qty:0,events:new Set(),last:""};return`<tr style="cursor:default${p.active===false?";opacity:.55":""}">
    <td><input class="cellin" data-pf="name" data-pid="${p.id}" value="${esc(p.name)}" aria-label="Name"></td>

    <td class="oh">${fmtN(s.qty)}</td><td>${s.events.size||dash}</td><td class="muted">${s.last?esc(fmtISO(s.last)):dash}</td>
    <td style="text-align:right;white-space:nowrap"><button class="ctl" data-pact="${p.id}">Activity</button>${used(p.id)?`<button class="ctl" data-ptoggle="${p.id}">${p.active===false?"Reactivate":"Mark inactive"}</button>`:`<button class="ctl" data-prm="${p.id}">Remove</button>`}</td></tr>`}).join("")}
  </tbody></table></div>`:`<div class="empty"><p class="big">${DB.people.length?"Nobody matches":"No people yet"}</p><p>${DB.people.length?"Try clearing the filters.":"Add the staff who collect stock, or add them as you record an issue."}</p></div>`}`;
}
function renderCount(){
  const st=ui.stock,sm=stockMap(),q=st.q.trim().toLowerCase();
  let list=DB.items.filter(i=>!i.archived);
  if(st.cat)list=list.filter(i=>i.category===st.cat);
  if(q)list=list.filter(i=>[i.name,i.code,i.location].join(" ").toLowerCase().includes(q));
  list.sort((a,b)=>(a.location||"").localeCompare(b.location||"")||a.name.localeCompare(b.name));

    <button class="btn btn-quiet" id="cnt-clear">Clear counts</button><button class="btn btn-primary" id="cnt-go">Apply stock take${entered?` (${entered})`:""}</button></div>
  <p class="faint" style="font-size:12px;margin:0">Counts you type are kept on this device until you apply them. Leave a row blank to skip it.</p>`;

const diffCell=d=>d===null?dash:d===0?'<span class="muted">Matches</span>':`<span class="qty diff ${d<0?"neg":"pos"}">${d>0?"+":""}${fmtN(d)}</span>`;

  $("homePage").classList.toggle("hide",ui.section!=="home");
  $("planPage").classList.toggle("hide",ui.section!=="plan");
  $("docsPage").classList.toggle("hide",ui.section!=="docs");

  if(ui.section==="docs"){renderDocsToolbar();renderDocsList()}else if(ui.section==="stock")renderStock();else if(ui.section==="plan")renderPlanner();else if(ui.section==="pol")renderPolicy();else renderHome();

function renderAll(fromSnap){
  renderSide();renderMain();

function submitAct(){
  const it=get("items",ui.peek.id);if(!it)return;const a=ui.act,oh=stockMap()[it.id]||0;a.err="";
  const first=!DB.moves.some(m=>m.itemId===it.id);
  if(a.kind==="Adjust"){
    if(a.counted===undefined||a.counted===""||num(a.counted)<0){a.err="Enter the quantity actually on the shelf.";return renderPeek()}
    const diff=num(a.counted)-oh;if(!diff){a.err="That matches the current count, so there's nothing to adjust.";return renderPeek()}

    if(a.kind==="Receive"){recordMove({itemId:it.id,kind:first?"Opening":"Received",qty:q,date:a.date||todayISO(),note:a.note||""});toast(first?`Opening stock set to ${q}`:`Received ${q}`)}

      const r=resolvePerson(a);if(r.err){a.err=r.err;return renderPeek()}
      recordMove({itemId:it.id,kind:a.kind==="Issue"?"Issued":"Returned",qty:a.kind==="Issue"?-q:q,personId:r.p.id,personName:r.p.name,department:r.p.department,event:(a.event||"").trim(),eventDate:a.eventDate||todayISO(),date:todayISO(),note:a.note||""});
      toast(`${a.kind==="Issue"?"Issued":"Returned"} ${q} ${a.kind==="Issue"?"to":"from"} ${r.p.name}`);
      ui.act={kind:a.kind,personId:r.p.id,event:a.event,eventDate:a.eventDate,date:todayISO()};renderAll();return;
    }
  }

}

  if(dl){try{await dl.save({filename,data})}catch(err){if(err&&err.code!=="declined")toast(err.code==="rate_limited"?"A save is already open. Try again shortly.":"Couldn't save the file here.")}return}
  const u=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
}

function exportDocs(){

    return[d.ref,d.prevRef,d.title,d.category,d.type,d.classification,d.status,d.version,d.prevVersion,d.owner,d.approver,d.approvedDate,d.effectiveDate,d.reviewCycle||"",d.reviewDate,d.checkedOutBy,d.location,d.keywords,fmtDate(d.created),fmtDate(d.updated),last?`v${last.v}: ${last.summary}`:""]});

function exportInventory(){

}

    Object.keys(STORES).forEach(s=>{if(!Array.isArray(src[s]))return;src[s].forEach(x=>{if(!x||typeof x!=="object"||!x.id)return;const rec=STORES[s].norm(x);const i=DB[s].findIndex(y=>y.id===rec.id);if(i>=0)DB[s][i]=rec;else DB[s].push(rec);write(s,rec);n++})});

const peek=$("peek");
const DOC_DELAY={title:500,notes:700,owner:600,approver:600,keywords:600,location:600,prevRef:500,prevVersion:500};
const ITEM_DELAY={name:500,code:500,unit:500,location:600,supplier:600,unitCost:600,notes:700,reorderLevel:500};
const ORD_DELAY={ref:500,qty:400,total:600,supplier:600,po:600,unitCost:400,setupCost:400,freight:400,requestedBy:600,notes:700,product:600,colour:600,variant:600};
peek.addEventListener("input",e=>{
  const t=e.target;if(!ui.peek)return;const k=ui.peek.kind;
  if(k==="order"){
    if(t.dataset.r){ui.recv[t.dataset.r]=t.value;return}
    if(t.id==="o-notes")grow(t);
    const f=t.dataset.o;if(f&&ORD_DELAY[f]&&t.type!=="date"){setF("orders",ui.peek.id,{[f]:t.value},ORD_DELAY[f]);if(["qty","unitCost","setupCost","freight"].includes(f))refreshOrderBits()}
    return}
  if(t.id==="lg-sum"){$("lg-go").disabled=!t.value.trim();return}
  if(t.classList.contains("peek-title")||t.id==="f-notes")grow(t);
  if(k==="doc"){const f=t.dataset.f,id=ui.peek.id;
    if(f==="ref"){$("dupwarn").innerHTML=dupWarn(Object.assign({},get("docs",id),{ref:t.value}));return}
    if(f&&DOC_DELAY[f]&&t.type!=="date")setF("docs",id,{[f]:t.value},DOC_DELAY[f]);return}
  if(k==="item"){
    if(t.dataset.a){ui.act[t.dataset.a]=t.value;return}
    const f=t.dataset.f;if(f&&ITEM_DELAY[f])setF("items",ui.peek.id,{[f]:f==="reorderLevel"?num(t.value):t.value},ITEM_DELAY[f]);return}
  if(k==="batch"){
    if(t.dataset.b){ui.batch[t.dataset.b]=t.value;return}
    if(t.dataset.li!==undefined){ui.batch.lines[+t.dataset.li][t.dataset.lf]=t.value;return}
  }
});
peek.addEventListener("change",e=>{
  const t=e.target;if(!ui.peek)return;const k=ui.peek.kind;
  if(k==="order"){
    if(t.dataset.r){ui.recv[t.dataset.r]=t.value;return}
    const f=t.dataset.o,o=get("orders",ui.peek.id);if(!f||!o)return;
    if(f==="itemId"){
      if(t.value==="__new"){ui.ordNew=true;renderPeek();setTimeout(()=>{const x=$("o-newname");x&&x.focus()},0);return}
      ui.ordNew=false;const it=get("items",t.value),patch={itemId:t.value};
      if(it){if(!o.supplier&&it.supplier)patch.supplier=it.supplier;if(!o.unitCost&&it.unitCost)patch.unitCost=it.unitCost;if(!o.docId&&it.docId){const d=get("docs",it.docId);if(d){patch.docId=d.id;patch.docVersion=d.version}}}
      setF("orders",o.id,patch,0);renderAll();return}
    if(f==="docId"){const d=get("docs",t.value);setF("orders",o.id,{docId:t.value,docVersion:d?d.version:""},0);renderAll();return}
    if(t.type==="date"||t.tagName==="SELECT"){setF("orders",o.id,{[f]:t.value},0);renderAll();return}
    if(["qty","total","unitCost","setupCost","freight"].includes(f)){setF("orders",o.id,{[f]:t.value},0);renderMain();return}
    return}
  if(k==="doc"){const f=t.dataset.f,id=ui.peek.id;if(!f)return;const d=get("docs",id);
    if(f==="ref")return commitRef(t);
    if(f==="version")return commitVersion(t);
    if(f==="status")return changeStatus(id,t.value);
    if(f==="reviewCycle"||f==="effectiveDate"||f==="approvedDate"){const patch={[f]:f==="reviewCycle"?+t.value:t.value};const rv=recomputeReview(Object.assign({},d,patch));if(rv!==d.reviewDate)patch.reviewDate=rv;
      setF("docs",id,patch,0);renderAll();if(patch.reviewDate&&patch.reviewDate!==d.reviewDate&&f!=="approvedDate")toast(`Next review set to ${fmtISO(patch.reviewDate)}`);return}
    if(t.tagName==="SELECT"||t.type==="date"){setF("docs",id,{[f]:t.value},0);renderAll();return}
    if(f==="location")renderPeek();return}
  if(k==="item"){
    if(t.dataset.a){ui.act[t.dataset.a]=t.value;if(t.dataset.a==="personId")renderPeek();return}
    const f=t.dataset.f;if(f&&t.tagName==="SELECT"){setF("items",ui.peek.id,{[f]:t.value},0);renderAll()}return}
  if(k==="batch"){
    if(t.dataset.b){ui.batch[t.dataset.b]=t.value;if(t.dataset.b==="personId")renderPeek();return}
    if(t.dataset.li!==undefined){ui.batch.lines[+t.dataset.li][t.dataset.lf]=t.value;renderPeek()}
  }
});

    if(t.id==="o-reopen")return setOrderStatus(o.id,num(o.received)>0?"Part delivered":"Planning");

    if(t.id==="o-del")return armed(t,()=>{delRec("orders",o.id);closePeek();toast(`Deleted ${o.ref||"order"}. Stock already received stays in stock.`)},"Confirm delete");
    if(t.id==="o-newgo"){const n=$("o-newname").value.trim();if(!n){$("o-newname").focus();return}
      const it=addRec("items",normItem({id:newId(),name:n,category:$("o-newcat").value,supplier:o.supplier,unitCost:o.unitCost,docId:o.docId}));
      setF("orders",o.id,{itemId:it.id},0);ui.ordNew=false;renderAll();toast(`Added ${n} to stock items`);return}
